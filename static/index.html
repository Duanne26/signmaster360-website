<script>
let smVehicleData=[];
async function smVehicleLoad(){
 const search=document.getElementById('vehicleSearch');
 const query=search?.value||'';
 const results=document.getElementById('smVehicleResults');
 const table=results?.querySelector('.tablewrap');
 const scrollLeft=table?.scrollLeft||0;
 const scrollTop=table?.scrollTop||0;
 try{const r=await api('/vehicle-catalogue');
  if(!document.getElementById('smVehicleResults'))return;
  smVehicleData=[...(r.private||[]),...(r.master||[])];
  const currentSearch=document.getElementById('vehicleSearch');
  if(currentSearch && !currentSearch.value && query)currentSearch.value=query;
  smVehicleFilter();
  const currentTable=document.querySelector('#smVehicleResults .tablewrap');
  if(currentTable){currentTable.scrollLeft=scrollLeft;currentTable.scrollTop=scrollTop;}
 }
 catch(e){const el=document.getElementById('smVehicleResults');if(el)el.textContent=e.message;}
}
function smVehicleMissingFields(x){return ['wheelbase_mm','overall_length_mm','overall_width_mm','overall_height_mm'].filter(k=>x[k]==null||x[k]==='');}
function smVehicleMeasured(x){return smVehicleMissingFields(x).length===0;}
function smVehicleHasAnyDimension(x){return smVehicleMissingFields(x).length<4;}
function smVehicleMeasurementLabel(x){
 const missing=smVehicleMissingFields(x);
 if(missing.length)return 'Incomplete — missing '+missing.map(k=>k.replace('overall_','').replace('_mm','')).join(', ');
 const state=String(x.measurement_status||'').toLowerCase();
 return state==='verified'?'Dimensions entered — source marked verified':'Dimensions entered — verify before cutting';
}
function smVehicleVariants(make,model){
 const normal=v=>String(v||'').trim().toLowerCase();
 return smVehicleData.filter(x=>x.scope==='master'&&normal(x.make)===normal(make)&&normal(x.model)===normal(model)&&smVehicleMeasured(x));
}
function smVehicleSelectVariant(id){
 const select=document.getElementById(id);if(!select||!select.value)return;
 const x=smVehicleData.find(v=>v.scope==='master'&&v.id===select.value);
 if(x)smVehicleForm(null,String(x.id));
}
function smVehicleFilter(){
 const el=document.getElementById('smVehicleResults');if(!el)return;
 const q=(document.getElementById('vehicleSearch')?.value||'').trim().toLowerCase();
 const scope=document.getElementById('smVehicleScope')?.value||'all';
 const status=document.getElementById('smVehicleStatus')?.value||'all';
 const visibleRecords=smVehicleData.filter(x=>{
  if(scope!=='all'||x.scope!=='master'||smVehicleMeasured(x))return true;
  return !smVehicleData.some(p=>p.scope==='private'&&String(p.make).trim().toLowerCase()===String(x.make).trim().toLowerCase()&&String(p.model).trim().toLowerCase()===String(x.model).trim().toLowerCase());
 });
 const data=visibleRecords.filter(x=>{
  if(scope!=='all'&&x.scope!==scope)return false;
  if(status==='missing'&&smVehicleMeasured(x))return false;
  if(status==='entered'&&!smVehicleHasAnyDimension(x))return false;
  if(status==='templates'&&!(x.scope==='private'&&Number(x.template_count)>0))return false;
  return [x.make,x.model,x.variant,x.generation,x.cab_or_body,x.year_from,x.year_to].some(v=>String(v??'').toLowerCase().includes(q));
 }).sort((a,b)=>Number(smVehicleMeasured(b))-Number(smVehicleMeasured(a))||String(a.make).localeCompare(String(b.make))||String(a.model).localeCompare(String(b.model)));
 const summary=document.getElementById('smVehicleSummary');
 if(summary){const privateCount=smVehicleData.filter(x=>x.scope==='private').length;const measured=smVehicleData.filter(smVehicleMeasured).length;summary.textContent=data.length+' matching vehicles · '+privateCount+' saved privately · '+measured+' records with all four main dimensions (not necessarily verified) · select the exact derivative';}
 const oldTable=el.querySelector('.tablewrap');const top=oldTable?.scrollTop||0;const left=oldTable?.scrollLeft||0;
 const mm=(x,k)=>x[k]==null||x[k]===''?'—':esc(String(x[k]));
 const rows=data.map((x,i)=>{
  const variants=!smVehicleMeasured(x)?smVehicleVariants(x.make,x.model):[];
  const selectorId='smVehicleVariant_'+i;
  const selector=variants.length?'<div style="margin-top:6px"><label for="'+selectorId+'">Measured derivatives ('+variants.length+')</label><select id="'+selectorId+'" onchange="smVehicleSelectVariant(&#39;'+selectorId+'&#39;)"><option value="">Select exact derivative…</option>'+variants.map(v=>'<option value="'+esc(String(v.id))+'">'+esc([v.year_from||'',v.variant||'',v.cab_or_body||'',v.generation||''].filter(Boolean).join(' · ')||'Specified derivative')+'</option>').join('')+'</select></div>':'';
  const action=x.scope==='private'?'<button class="secondary" type="button" onclick="smVehiclePdf('+Number(x.id)+')">PDF + Views</button> <button class="secondary" type="button" onclick="smVehicleTemplates('+Number(x.id)+')">Templates</button> <button class="secondary" type="button" onclick="smVehicleOpenSharedForId('+Number(x.id)+')">Global Vehicle Templates</button> '+(me.role==='admin'?'<button class="secondary" type="button" onclick="smVehicleForm('+Number(x.id)+')">Edit</button>':''):'<button class="secondary" type="button" onclick="smVehicleSharedTemplates(&#39;'+esc(String(x.id))+'&#39;)">Global Vehicle Templates</button> <button class="secondary" type="button" onclick="smVehicleForm(null,&#39;'+esc(String(x.id))+'&#39;)">Use as starting point</button>';
  return '<tr><td>'+esc(x.make)+'</td><td>'+esc(x.model)+'</td><td>'+esc([x.year_from||'',x.cab_or_body||'',x.variant||''].filter(Boolean).join(' · ')||'Variant not confirmed')+selector+'</td><td>'+mm(x,'wheelbase_mm')+'</td><td>'+mm(x,'overall_length_mm')+'</td><td>'+mm(x,'overall_width_mm')+'</td><td>'+mm(x,'overall_height_mm')+'</td><td>'+esc(smVehicleMeasurementLabel(x))+'</td><td>'+esc(x.scope==='master'?'Shared reference':'Private')+'</td><td>'+action+'</td></tr>';
 });
 el.innerHTML='<div class="tablewrap"><table><thead><tr><th>Make</th><th>Model</th><th>Year / Body / Derivative</th><th>Wheelbase (mm)</th><th>Length (mm)</th><th>Width (mm)</th><th>Height (mm)</th><th>Measurements</th><th>Library</th><th>Actions</th></tr></thead><tbody>'+(rows.join('')||'<tr><td colspan="10">No vehicles match these filters.</td></tr>')+'</tbody></table></div>';
 const table=el.querySelector('.tablewrap');if(table){table.scrollTop=top;table.scrollLeft=left;}
}
function smVehicleOpenSharedForId(id){
 const vehicle=smVehicleData.find(x=>x.scope==='private'&&Number(x.id)===Number(id));
 if(!vehicle){sm360Notice('Vehicle not found. Refresh the catalogue and try again.');return;}
 return smVehicleOpenSharedFor(vehicle.make,vehicle.model);
}
function smVehicleOpenSharedFor(make,model){
 const normal=v=>String(v||'').trim().toLowerCase();
 const shared=smVehicleData.find(x=>x.scope==='master'&&normal(x.make)===normal(make)&&normal(x.model)===normal(model));
 if(!shared){sm360Notice('No global vehicle reference exists for '+make+' '+model+'.');return;}
 // A visible loading state ensures a failed network request is not a silent click.
 try{closeModal(true);modal('<h2>Global Vehicle Templates</h2><p>Loading shared drawings...</p>');
  Promise.resolve(smVehicleSharedTemplates(String(shared.id))).catch(e=>sm360Notice('Unable to open global templates: '+(e?.message||e)));
 }catch(e){sm360Notice('Unable to open global templates: '+(e?.message||e));}
}
function smVehicleExportCsv(){
 const records=smVehicleData.filter(x=>x.scope==='private');
 if(!records.length){notify('No saved private vehicles to export');return;}
 const keys=['make','model','year_from','year_to','generation','variant','cab_or_body','wheelbase_mm','overall_length_mm','overall_width_mm','overall_height_mm','front_overhang_mm','rear_overhang_mm','source_reference','notes','template_count'];
 const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const csv='\uFEFF'+[keys.join(','),...records.map(x=>keys.map(k=>quote(x[k])).join(','))].join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='signmaster360-vehicle-catalogue.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function smVehicleImportStarter(){
 if(me.role!=='admin'){notify('Only administrators can import starter models');return;}
 if(!confirm('Add the 42 starter model references to this business catalogue? Existing matching starter entries will be skipped. These are NOT verified vehicle templates or measurements.'))return;
 try{const r=await api('/vehicle-catalogue/import-starter',{method:'POST'});sm360Notice('Imported '+r.created+' starter models. '+r.skipped+' already existed. Measurements and drawings remain unverified.');await smVehicleLoad();}
 catch(e){notify(e)}
}
async function smVehicleTemplates(id){
 try{
  const files=await api('/vehicle-catalogue/'+id+'/templates');
  const opts=['left','right','front','rear','top','other'].map(v=>'<option value="'+v+'">'+v[0].toUpperCase()+v.slice(1)+'</option>').join('');
  modal('<h2>Vehicle templates</h2><p class="hint">Upload drawings for this exact vehicle variant. Unverified outlines are design references, not cutting patterns.</p><div class="tablewrap"><table><thead><tr><th>View</th><th>File</th><th>Actions</th></tr></thead><tbody>'+(files.map(f=>'<tr><td>'+esc(f.view_name)+'</td><td>'+esc(f.original_name)+'</td><td><a class="button secondary" href="/api/vehicle-catalogue/'+id+'/templates/'+Number(f.id)+'/download">Download</a> '+(me.role==='admin'?'<button type="button" class="secondary" onclick="smVehicleDeleteTemplate('+id+','+Number(f.id)+')">Remove</button>':'')+'</td></tr>').join('')||'<tr><td colspan="3">No templates uploaded yet</td></tr>')+'</tbody></table></div>'+(me.role==='admin'?'<form id="smVehicleUpload" class="formgrid"><div><label>Drawing view</label><select name="view_name">'+opts+'</select></div><div><label>PDF, SVG, PNG or JPG (max 10 MB)</label><input type="file" name="file" accept=".pdf,.svg,.png,.jpg,.jpeg" required></div><div class="wide actions"><button type="submit">Upload template</button></div></form>':''));
  const form=document.getElementById('smVehicleUpload');
  if(form)form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button[type=submit]');btn.disabled=true;try{const r=await fetch('/api/vehicle-catalogue/'+id+'/templates',{method:'POST',credentials:'same-origin',body:new FormData(form)});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.detail||'Upload failed')}smVehicleTemplates(id)}catch(err){notify(err);btn.disabled=false}};
 }catch(e){notify(e)}
}
async function smVehicleDeleteTemplate(id,fileId){
 if(!confirm('Remove this vehicle template?'))return;
 try{await api('/vehicle-catalogue/'+id+'/templates/'+fileId,{method:'DELETE'});smVehicleTemplates(id)}catch(e){notify(e)}
}
function smVehiclePdf(id){window.open('/api/vehicle-catalogue/'+id+'/pdf','_blank','noopener');}
function smVehicleForm(id=null,masterId=null){
 const x=id?smVehicleData.find(v=>v.scope==='private'&&v.id===id):masterId?smVehicleData.find(v=>v.id===masterId):{};
 if(!x)return;
 const fields=[['make','Make'],['model','Model'],['year_from','Year from'],['year_to','Year to'],['generation','Generation'],['variant','Variant'],['cab_or_body','Cab / body style'],['wheelbase_mm','Wheelbase (mm)'],['overall_length_mm','Overall length (mm)'],['overall_width_mm','Overall width (mm)'],['overall_height_mm','Overall height (mm)'],['front_overhang_mm','Front overhang (mm)'],['rear_overhang_mm','Rear overhang (mm)'],['source_reference','Measurement source / reference'],['notes','Notes']];
 modal('<h2>'+(id?'Edit vehicle measurements':'Save vehicle to private catalogue')+'</h2><p class="hint">Exact model, generation and cab must be confirmed. Never guess wheelbase or panel dimensions.</p><form id="smVehicleForm" class="formgrid">'+fields.map(([k,label])=>'<div><label>'+label+'</label><input name="'+k+'" '+(['year_from','year_to'].includes(k)?'type="number" min="1950" max="2100"':k.endsWith('_mm')?'type="number" min="0.01" step="0.1"':'type="text"')+' value="'+esc(x[k]??'')+'" '+(['make','model'].includes(k)?'required':'')+'></div>').join('')+'<div class="wide actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit">Save Vehicle</button></div></form>');
 document.getElementById('smVehicleForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k of ['year_from','year_to','wheelbase_mm','overall_length_mm','overall_width_mm','overall_height_mm','front_overhang_mm','rear_overhang_mm'])data[k]=data[k]===''?null:Number(data[k]);try{await api('/vehicle-catalogue'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(data)});closeModal(true);await smVehicleLoad();}catch(err){notify(err)}};
}
</script>

<script>

async function smVehicleSharedTemplates(modelKey){
 try{
  if(!/^master-\d+$/.test(modelKey))throw Error('Invalid shared model');
  const [files,status]=await Promise.all([
   api('/vehicle-catalogue/shared/'+modelKey+'/templates'),
   api('/vehicle-catalogue/publisher-status')
  ]);
  const publisher=!!status.can_publish;
  const hiluxImport=publisher&&modelKey==='master-0'?'<button type="button" class="secondary" onclick="smVehicleImportHiluxReference()">Import 2025 Hilux five-view reference set</button><p class="hint">Five illustrated views; NOT scale-verified or suitable for cutting.</p>':'';

  const gallery=files.length?'<div class="sm360-vehicle-gallery">'+files.map(f=>{
   const name=String(f.original_name||'');const isImage=/\.(png|jpe?g)$/i.test(name);
   const base='/api/vehicle-catalogue/shared/'+encodeURIComponent(modelKey)+'/templates/'+Number(f.id);
   const preview=isImage?'<img loading="lazy" alt="'+esc(f.view_name)+' vehicle reference" src="'+base+'/preview">':'<div class="sm360-vehicle-placeholder">'+(name.toLowerCase().endsWith('.pdf')?'PDF document':'Drawing file')+'</div>';
   return '<article class="sm360-vehicle-tile"><div class="sm360-vehicle-image">'+preview+'</div><div class="sm360-vehicle-details"><h3>'+esc(String(f.view_name||'Other').toUpperCase())+' view</h3><p class="sm360-vehicle-filename">'+esc(name)+'</p><p class="hint">Design reference — NOT verified to scale or suitable for cutting.</p><div class="sm360-vehicle-actions">'+(isImage?'<a class="button secondary" href="'+base+'/preview" target="_blank" rel="noopener">Preview</a>':'')+'<a class="button secondary" href="'+base+'/download">Download</a>'+(publisher?'<button type="button" class="secondary" onclick="smVehicleUnpublish(\''+esc(modelKey)+'\','+Number(f.id)+')">Remove</button>':'')+'</div></div></article>';
  }).join('')+'</div>':'<p>No shared drawings uploaded for this model yet.</p>';
  const upload=publisher?'<form id="smSharedUpload" class="formgrid" style="margin-top:16px"><h3 class="wide">Publish shared drawing</h3><div><label>View</label><select name="view_name" required><option value="left">Left</option><option value="right">Right</option><option value="front">Front</option><option value="rear">Rear</option><option value="top">Top</option><option value="other">Other</option></select></div><div><label>Drawing (SVG, PDF, PNG or JPG; max 10 MB)</label><input type="file" name="file" accept=".svg,.pdf,.png,.jpg,.jpeg" required></div><div class="wide"><label>Source reference / provenance</label><input name="source_reference" maxlength="500" required placeholder="Original drawing and measurement source"></div><div class="wide actions"><button type="submit">Publish drawing</button></div></form>':'';
  closeModal(true);modal('<h2>Global Vehicle Templates</h2><p class="hint">Available to all subscribed businesses. Private business uploads remain separate. Drawings are design references until verified.</p>' +gallery+hiluxImport+upload);
  const galleryDialog=document.querySelector('#modal .modal');if(galleryDialog)galleryDialog.classList.add('sm360-vehicle-dialog');
  // Upload a full five-view set without opening this dialogue five times.
  if(publisher){
   const bulk=document.createElement('form');bulk.id='smSharedBulk';bulk.className='formgrid';bulk.style.marginTop='18px';
   bulk.innerHTML='<h3 class="wide">Publish five-view set</h3><p class="wide hint">Choose only the views you have. Each file is uploaded separately, so a failed upload does not remove successful ones. All drawings remain Design Reference until verified.</p>'+['left','right','front','rear','top'].map(v=>'<div><label>'+v.charAt(0).toUpperCase()+v.slice(1)+' view</label><input type="file" data-view="'+v+'" accept=".svg,.pdf,.png,.jpg,.jpeg"></div>').join('')+'<div class="wide"><label>Source reference for this set</label><input name="source_reference" maxlength="500" required placeholder="Source of drawings and dimensions"></div><div class="wide actions"><button type="submit">Publish selected views</button></div>';
   const single=document.getElementById('smSharedUpload');if(single)single.after(bulk);
   bulk.onsubmit=async e=>{e.preventDefault();const selected=[...bulk.querySelectorAll('input[type=file]')].filter(i=>i.files.length);if(!selected.length){sm360Notice('Select at least one drawing.');return}const source=bulk.querySelector('[name=source_reference]').value.trim();if(!source){sm360Notice('Source reference is required.');return}const btn=bulk.querySelector('button[type=submit]');btn.disabled=true;let completed=0;let errors=[];
    for(const input of selected){const fd=new FormData();fd.append('view_name',input.dataset.view);fd.append('source_reference',source);fd.append('file',input.files[0]);try{const r=await fetch('/api/vehicle-catalogue/shared/'+modelKey+'/templates',{method:'POST',credentials:'same-origin',body:fd});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.detail||'Upload failed')}completed++}catch(err){errors.push(input.dataset.view+': '+err.message)}}
    sm360Notice(completed+' drawing(s) published.'+(errors.length?' Failed: '+errors.join('; '):''));await smVehicleSharedTemplates(modelKey);
   };
  }
  const form=document.getElementById('smSharedUpload');
  if(form)form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button[type=submit]');btn.disabled=true;try{const r=await fetch('/api/vehicle-catalogue/shared/'+modelKey+'/templates',{method:'POST',credentials:'same-origin',body:new FormData(form)});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.detail||'Upload failed')}await smVehicleSharedTemplates(modelKey)}catch(err){notify(err);btn.disabled=false}};
 }catch(e){closeModal(true);sm360Notice('Unable to load global vehicle templates: '+(e?.message||e))}
}
async function smVehicleImportHiluxReference(){
 if(!confirm('Publish five UNVERIFIED 2025 Hilux reference images to all subscribers? Not print-scale templates.'))return;
 try{
  const result=await api('/vehicle-catalogue/shared/import-hilux-2025-reference',{method:'POST'});
  sm360Notice(result.created+' views added; '+result.skipped+' already imported. DESIGN REFERENCE ONLY.');
  await smVehicleSharedTemplates('master-0');
 }catch(e){notify(e)}
}
async function smVehicleUnpublish(modelKey,id){
 if(!confirm('Remove this drawing from the shared catalogue?'))return;
 try{await api('/vehicle-catalogue/shared/'+modelKey+'/templates/'+id,{method:'DELETE'});await smVehicleSharedTemplates(modelKey)}catch(e){notify(e)}
}

</script>
