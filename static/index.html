/* Login visibility correction: prevent the appearance background overlay from

#root > .login {
  background:#203753 !important;
  border:1px solid #6386ad !important;
  box-shadow:0 20px 65px rgba(0,0,0,.38) !important;
  color:#fff !important;
  opacity:1 !important;
  filter:none !important;
  max-width:460px;
}
#root > .login h2 {color:#fff !important;font-size:24px;}
#root > .login p, #root > .login label {color:#e5f0ff !important;opacity:1 !important;}
#root > .login input, #root > .login select, #root > .login textarea {
  background:#fff !important;color:#14243c !important;
  border:2px solid #a6c5e6 !important;opacity:1 !important;
}
#root > .login input::placeholder {color:#52657e !important;}
#root > .login button, #root > .login button:not(.secondary):not(.ghost) {
  background:#11bce8 !important;color:#05253a !important;
  font-weight:800 !important;opacity:1 !important;
}
#root > .login a {color:#78e5ff !important;font-weight:750;text-decoration:underline;}
#root > .login .error {color:#ffb9b9 !important;}

let sm360PaymentFeedCursor=0;
let sm360PaymentFeedBusy=false;
let sm360PaymentFeedIdentity=null;
function sm360PaymentIdentity(){
 return me&&me.id!=null&&me.business_id!=null ? String(me.business_id)+':'+String(me.id) : null;
}
function sm360ResetPaymentNotifications(identity){
 sm360PaymentFeedIdentity=identity;
 sm360PaymentFeedCursor=0;
 document.querySelectorAll('.sm360-payment-toast').forEach(el=>el.remove());
}
async function sm360PollPaymentUpdates(){
 const identity=sm360PaymentIdentity();
 if(identity!==sm360PaymentFeedIdentity)sm360ResetPaymentNotifications(identity);
 if(!identity||!['sales','admin'].includes(me.role)||sm360PaymentFeedBusy)return;
 sm360PaymentFeedBusy=true;
 try{
  const data=await api('/payments/rep-updates?after='+sm360PaymentFeedCursor);
  if(sm360PaymentIdentity()!==identity)return;
  sm360PaymentFeedCursor=Math.max(sm360PaymentFeedCursor,Number(data.cursor)||0);
  for(const event of data.events||[]){
   if(sm360PaymentIdentity()!==identity)return;
   const toast=document.createElement('div');
   toast.className='sm360-payment-toast';
   toast.setAttribute('role','status');
   const heading=document.createElement('strong');heading.textContent='Payment updated — Job #'+event.job_id;
   const detail=document.createElement('p');detail.textContent=event.job_title+' · '+event.action;
   const open=document.createElement('button');open.type='button';open.textContent='Open Job';open.onclick=()=>{toast.remove();jobForm(event.job_id)};
   const close=document.createElement('button');close.type='button';close.className='secondary';close.textContent='Dismiss';close.onclick=()=>toast.remove();
   toast.append(heading,detail,open,close);document.body.appendChild(toast);
   if(document.querySelectorAll('.sm360-payment-toast').length>3)document.querySelector('.sm360-payment-toast')?.remove();
  }
  if(sm360PaymentIdentity()===identity&&(data.events||[]).length&&tab==='jobs')loadJobBalances();
 }catch(e){console.warn('Payment notifications unavailable:',e.message)}
 finally{sm360PaymentFeedBusy=false}
}
async function refresh(){if(['stock_controller','production'].includes(me.role)){users=[];customers=[];jobs=[];return;}[users,customers,jobs]=await Promise.all([api('/users'),api('/customers'),api('/jobs')]);if(tab==='jobs'||tab==='board')loadJobBalances()}

/* Launch the installed WhatsApp app using the OS protocol handler.
   Browsers cannot reliably detect app installation. The user chooses Web only
   if Desktop does not open. No account or messages pass through SignMaster. */
function openPersonalWhatsApp(event){
  // Keep the native link activation so Windows/browser can handle whatsapp://.
  // Display an optional fallback in the current app; do not automatically
  // open WhatsApp Web, which could use a shared browser session.
  setTimeout(()=>{
    if(document.visibilityState==='hidden'||!me)return;
    const existing=document.getElementById('sm360WaFallback');
    if(existing)existing.remove();
    const box=document.createElement('div');
    box.id='sm360WaFallback';

/* Workshop voice preferences are scoped to the signed-in user and business.
   The Live Workshop page reads these same-origin settings, including inside its iframe. */
const sm360WorkshopRolesLocked=['production','stock_controller'];
function sm360WorkshopIdentity(){return typeof me!=='undefined'&&me&&me.id&&me.business_id?me:null;}
function sm360WorkshopKey(suffix){const u=sm360WorkshopIdentity();return u?'sm360_workshop_'+u.business_id+'_'+u.id+'_'+suffix:null;}
function sm360WorkshopForced(){const u=sm360WorkshopIdentity();return !!u&&sm360WorkshopRolesLocked.includes(String(u.role||'').toLowerCase());}
function sm360WorkshopAllowed(){const u=sm360WorkshopIdentity();return !!u&&String(u.role||'').toLowerCase()!=='viewer';}
function sm360WorkshopEnabled(){if(!sm360WorkshopAllowed())return false;if(sm360WorkshopForced())return true;const key=sm360WorkshopKey('enabled');try{return localStorage.getItem(key)!=='0'}catch(_){return true}}
function sm360WorkshopVolume(){const key=sm360WorkshopKey('volume');try{const n=Number(localStorage.getItem(key));return localStorage.getItem(key)!==null&&Number.isFinite(n)?Math.min(100,Math.max(0,n)):85}catch(_){return 85}}
window.sm360RefreshWorkshopVoiceControl=function(){
 const button=document.getElementById('sm360WorkshopVoiceToggle'),slider=document.getElementById('sm360WorkshopVolume');
 if(!button)return;
 const locked=sm360WorkshopForced(),allowed=sm360WorkshopAllowed(),on=sm360WorkshopEnabled();
 button.disabled=!allowed||locked;
 button.textContent=!allowed?'Workshop Voice · Unavailable for Viewer':locked?'🔊 Workshop Voice · Always ON (Required)':on?'🔊 Workshop Voice ON · Turn Off':'🔇 Workshop Voice OFF · Turn On';
 button.setAttribute('aria-pressed',String(on));
 if(slider){slider.value=String(sm360WorkshopVolume());slider.disabled=!allowed;}
};
window.sm360ToggleWorkshopVoice=function(){if(!sm360WorkshopAllowed()||sm360WorkshopForced())return;const key=sm360WorkshopKey('enabled');if(!key)return;try{localStorage.setItem(key,sm360WorkshopEnabled()?'0':'1')}catch(_){}window.sm360RefreshWorkshopVoiceControl();if(sm360WorkshopEnabled())window.sm360TestWorkshopVoice?.();};
window.sm360SetWorkshopVolume=function(v){if(!sm360WorkshopAllowed())return;const key=sm360WorkshopKey('volume');if(key)try{localStorage.setItem(key,String(Math.min(100,Math.max(0,Number(v)||0))))}catch(_){};};
window.sm360TestWorkshopVoice=function(){if(!sm360WorkshopEnabled()||!('speechSynthesis'in window))return;try{const u=new SpeechSynthesisUtterance('Workshop voice test. New order uploaded. Please see instructions.');u.lang='en-ZA';u.volume=sm360WorkshopVolume()/100;window.speechSynthesis.resume();window.speechSynthesis.speak(u)}catch(_){}};

async function refreshToolbarAvatar(){

    if(res.status===404)return;
    if(!res.ok)throw Error('Could not load profile photo');
    const url=URL.createObjectURL(await res.blob());
    const old=sm360AvatarObjectUrl;sm360AvatarObjectUrl=url;
    const img=document.createElement('img');img.alt='';img.src=url;toolbar.replaceChildren(img);
    const profile=$('#profileAvatar');if(profile){const pimg=document.createElement('img');pimg.alt='My profile photo';pimg.src=url;profile.replaceChildren(pimg)}

let content='';if(tab==='order_updates')content=sm360OrderUpdatesContent();if(tab==='profile')content=`<section class="sm360-profile-center"><div class="card sm360-profile-card"><h2>My Profile</h2><div style="display:flex;align-items:center;gap:16px;margin:16px 0"><div class="sm360-profile-avatar" id="profileAvatar">👤</div><div><b id="profileDisplayName">${esc(me.name)}</b><p class="muted" style="margin:4px 0">Your personal account profile</p><label for="myAvatarFile" style="display:inline-block;cursor:pointer;margin:7px 8px 0 0">📷 Change picture</label><input id="myAvatarFile" type="file" accept="image/jpeg,image/png,image/webp" style="max-width:215px" onchange="uploadMyAvatar(event)"><button type="button" class="secondary" onclick="removeMyAvatar()">Remove picture</button><p class="muted" style="font-size:12px">JPG, PNG or WebP · max 2 MB · square crop</p></div></div><form id="myProfileForm" oninput="this.dataset.edited='yes'" onsubmit="saveMyProfile(event)"><div class="formgrid"><div><label>First name</label><input name="first_name" maxlength="80" required autocomplete="given-name"></div><div><label>Surname</label><input name="surname" maxlength="80" required autocomplete="family-name"></div><div><label>Email</label><input value="${esc(me.email)}" disabled></div><div><label>Staff role</label><input value="${esc(me.role)}" disabled></div></div><div class="actions"><button type="submit">Save Profile</button></div></form><p class="hint">Upload your own profile picture, or use your initials. Only you can change your personal profile.</p></div></section>`;if(tab==='dashboard'){
 const financialStats=[['Total Quoted',money(jobs.filter(j=>j.status==='Quote').reduce((sum,j)=>sum+(Number(j.price)||0),0)),'Quote'],['Outstanding Payments','Loading…','payments']];
 const jobStats=[['Total Jobs',jobs.filter(j=>!isCompletedStatus(j.status)).length,'all'],['Quote',jobs.filter(j=>j.status==='Quote').length,'Quote'],['Awaiting Design Approval',jobs.filter(j=>statusLabel(j.status)==='Awaiting Design Approval').length,'Awaiting Design Approval'],['In Production',jobs.filter(j=>['Design','Approved','Design Approved','Printing','Assembling'].includes(j.status)).length,'production'],['Design',jobs.filter(j=>j.status==='Design').length,'Design'],['Design Approved',jobs.filter(j=>statusLabel(j.status)==='Design Approved').length,'Design Approved'],['Printing',jobs.filter(j=>j.status==='Printing').length,'Printing'],['Completed & Ready for collection',jobs.filter(j=>statusLabel(j.status)==='Completed & Ready for collection').length,'Completed & Ready for collection'],['Collected',jobs.filter(j=>isCompletedStatus(j.status)).length,'completed'],['Assembling',jobs.filter(j=>j.status==='Assembling').length,'Assembling']];
 const dashboardCard=([label,value,key])=>`<button type="button" class="card sm360-dashboard-card" data-dashboard-key="${esc(key)}" onclick="openDashboardCard('${key}')" aria-label="Open ${esc(label)}"><span class="muted">${esc(label)}</span><span class="stat">${value}</span><span class="sm360-card-link">View details ↗</span></button>`;
 content=`<div class="sm360-dashboard-sections"><section class="sm360-dashboard-section sm360-dashboard-financial"><h2>Financial Overview</h2><div class="sm360-dashboard-financial-cards">${financialStats.map(dashboardCard).join('')}</div></section><section class="sm360-dashboard-section sm360-dashboard-operations"><h2>Job Overview</h2><div class="sm360-dashboard-job-cards">${jobStats.map(dashboardCard).join('')}</div></section></div>`;
}
if(tab==='company')content=`<div class="card sm360-company-fullscreen"><h2>Company Information</h2>${me.role==='admin'?`<h2>Company details</h2><div class="card" style="margin:12px 0;border:1px solid #39c7dc"><h3>Your company logo for quotations and invoices</h3><p>Upload your own PNG, JPG or WebP logo (max 3 MB). This replaces the SignMaster 360 software logo on newly issued PDFs.</p><img id="companyLogoPreview" alt="Your company logo preview" style="display:none;max-width:240px;max-height:130px;object-fit:contain;background:white;padding:8px;border-radius:8px"><div class="toolbar"><input type="file" id="companyLogoFile" accept="image/png,image/jpeg,image/webp" style="max-width:320px"><button type="button" onclick="uploadCompanyLogo()">Upload company logo</button></div><p class="muted" id="companyLogoStatus"></p></div><p>Shown on newly created PDFs. Existing PDFs keep the details saved at issue time.</p><form id="companyForm" class="formgrid">${[['name','Business name'],['address','Business address'],['phone','Phone'],['email','Email'],['registration','Company registration'],['vat_number','VAT number'],['banking','Banking details']].map(([k,l])=>`<div class="${['address','banking'].includes(k)?'wide':''}"><label>${l}</label>${['address','banking'].includes(k)?`<textarea name="${k}" rows="3"></textarea>`:`<input name="${k}" ${k==='name'?'required':''}>`}</div>`).join('')}<div class="wide"><button>Save business details</button></div></form><div id="sm360CustomerMessageSettings" class="card" style="margin-top:18px"><h3>Default Customer Message</h3><p class="muted">One editable order update for WhatsApp and email. Messages are reviewed before sending.</p><div id="sm360CustomerTemplateEditor">Loading templates…</div></div><div class="card" style="margin-top:18px"><h3>Default Payment Message</h3><p class="muted">One editable payment update for WhatsApp and Email.</p><div id="sm360PaymentTemplateEditor">Loading payment message…</div></div>`:''}</div>`;
if(tab==='jobs')content=`<div class="sm360-job-main-tabs"><button type="button" class="secondary" onclick="go('quotations')">Quotes</button><button type="button" class="sm360-job-main-active" aria-current="page">Active Jobs</button></div>${dashboardJobFilter?`<div class="sm360-filter-notice">Showing: ${esc(dashboardJobFilter==='production'?'In Production':dashboardJobFilter==='all-inclusive'?'All Jobs (including completed)':dashboardJobFilter)} <button type="button" class="secondary" onclick="clearDashboardJobFilter()">Clear filter</button></div>`:''}<div id="repJobTabs">${jobGroupTabs()}</div><div class="toolbar"><input id="search" placeholder="Search jobs, customers, assigned staff..." oninput="filterJobs()"><select id="statusFilter" onchange="filterJobs()"><option value="">All statuses</option>${stages.map(s=>`<option>${s}</option>`).join('')}</select></div><div id="jobResults"></div>`;
if(tab==='board'){
 const boardMembers=[...new Set(jobs.map(j=>String(j.rep_name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 const selectedBoardMember=boardMembers.includes(sm360BoardMember)?sm360BoardMember:'';
 const boardMemberJobs=jobs.filter(j=>!selectedBoardMember||String(j.rep_name||'').trim()===selectedBoardMember);
 const boardVisibleJobs=boardMemberJobs.filter(j=>sm360BoardView==='completed'?isCompletedStatus(j.status):(!isCompletedStatus(j.status)&&j.status!=='Cancelled'));
 content=`<section class="sm360-production"><div class="sm360-production-toolbar"><div><h2>Production workflow</h2><p class="muted">Compact, scrollable columns. Open a job to view or update its details.</p></div><div class="sm360-production-tabs"><button type="button" class="${sm360BoardView==='active'?'active':''}" onclick="sm360SetBoardView('active')">Active jobs (${boardMemberJobs.filter(j=>!isCompletedStatus(j.status)&&j.status!=='Cancelled').length})</button><button type="button" class="${sm360BoardView==='completed'?'active':''}" onclick="sm360SetBoardView('completed')">Completed (${boardMemberJobs.filter(j=>isCompletedStatus(j.status)).length})</button></div></div><div class="sm360-board-member-tabs" aria-label="Filter jobs by assigned team member"><button type="button" class="${!selectedBoardMember?'active':''}" onclick="sm360SetBoardMember('')">All Jobs (${jobs.filter(j=>sm360BoardView==='completed'?isCompletedStatus(j.status):(!isCompletedStatus(j.status)&&j.status!=='Cancelled')).length})</button>${boardMembers.map(name=>`<button type="button" class="${selectedBoardMember===name?'active':''}" onclick="sm360SetBoardMember(decodeURIComponent('${encodeURIComponent(name)}'))">${esc(name)} (${jobs.filter(j=>String(j.rep_name||'').trim()===name&&(sm360BoardView==='completed'?isCompletedStatus(j.status):(!isCompletedStatus(j.status)&&j.status!=='Cancelled'))).length})</button>`).join('')}</div><div class="sm360-production-controls"><input id="sm360BoardSearch" aria-label="Search production jobs" placeholder="Search customer, job number or description..." value="${esc(sm360BoardSearch)}" oninput="sm360FilterBoard(this.value)"><span class="muted">Each column scrolls independently</span></div><div class="board sm360-production-board">${stages.filter(s=>sm360BoardView==='completed'?isCompletedStatus(s):(!isCompletedStatus(s)&&s!=='Cancelled')).map(s=>{const laneJobs=boardVisibleJobs.filter(j=>s==='Collected'?isCompletedStatus(j.status):j.status===s);return `<section class="lane sm360-production-lane"><div class="sm360-production-lane-head"><strong>${esc(s)}</strong><span class="sm360-production-count" data-stage-count="${esc(s)}">${laneJobs.length}</span></div><div class="sm360-production-cards">${laneJobs.map(j=>`<button type="button" class="job sm360-production-job" data-search="${esc([j.id,j.title,j.customer_name,j.rep_name].join(' ').toLowerCase())}" onclick="jobForm(${j.id})"><span class="sm360-production-customer">${esc(j.customer_name||'No customer')}</span><span class="sm360-production-job-title">#${j.id} ${esc(j.title)}</span><span class="sm360-production-job-finance"><span class="sm360-production-rep">${esc(j.rep_name||'Unassigned')}</span>${sm360BoardView==='completed'?`<span class="sm360-production-finance-cell">Value <b>${money(j.price)}</b></span><span class="sm360-production-finance-cell">Paid <b data-board-paid="${j.id}">—</b></span><span class="sm360-production-finance-cell">Outstanding <b data-board-balance="${j.id}">—</b></span>`:``}</span></button>`).join('')}</div><div class="sm360-production-empty" ${laneJobs.length?'hidden':''}>No matching jobs</div></section>`}).join('')}</div></section>`;
}

if(tab==='customers')content=`<section class="sm360-customers"><div class="sm360-customer-overview"><div class="sm360-customer-kpi"><span>Total customers</span><strong>${customers.length}</strong></div><div class="sm360-customer-kpi"><span>Business customers</span><strong>${customers.filter(c=>c.customer_type==='company'||!!c.company_name||!!c.business_registration_number).length}</strong></div><div class="sm360-customer-kpi"><span>Customers with jobs</span><strong>${customers.filter(c=>jobs.some(j=>Number(j.customer_id)===Number(c.id))).length}</strong></div></div><div class="sm360-customer-directory"><div class="sm360-customer-controls"><input id="customerSearch" type="search" placeholder="Search customer, company, phone or email..." value="${esc(sm360CustomerQuery)}" oninput="sm360CustomerQuery=this.value;sm360CustomerPage=1;filterCustomerRows()" aria-label="Search customers"><select id="sm360CustomerTypeFilter" onchange="sm360CustomerType=this.value;sm360CustomerPage=1;filterCustomerRows()"><option value="all" ${sm360CustomerType==='all'?'selected':''}>All customers</option><option value="company" ${sm360CustomerType==='company'?'selected':''}>Businesses</option><option value="individual" ${sm360CustomerType==='individual'?'selected':''}>Individuals</option></select><select id="sm360CustomerPageSize" aria-label="Customers per page" onchange="sm360CustomerPageSize=Number(this.value);sm360CustomerPage=1;filterCustomerRows()">${[10,20,50].map(n=>`<option value="${n}" ${sm360CustomerPageSize===n?'selected':''}>${n} per page</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Customer / Company</th><th>Type</th><th>Contact person</th><th>Phone / WhatsApp</th><th>Email</th><th>Location</th><th>Jobs</th><th>Manage Customer</th></tr></thead><tbody id="customerSearchRows">${customers.map(c=>{const isBusiness=c.customer_type==='company'||!!c.company_name||!!c.business_registration_number;return `<tr data-customer-type="${isBusiness?'company':'individual'}" data-customer-search="${esc([c.name,c.company_name,c.phone,c.email,c.contact_person].join(' ').toLowerCase())}"><td><div class="sm360-customer-name">${esc(c.name)}</div>${c.company_name&&c.company_name!==c.name?`<div class="sm360-customer-sub">${esc(c.company_name)}</div>`:''}</td><td>${isBusiness?'Business':'Individual'}</td><td>${esc(c.contact_person||'—')}</td><td><div>${c.phone?`<a href="tel:${esc(String(c.phone).replace(/[^+0-9]/g,''))}">${esc(c.phone)}</a>`:'—'}</div>${c.whatsapp?`<div class="sm360-customer-sub">WhatsApp: ${esc(c.whatsapp)}</div>`:''}</td><td>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'—'}</td><td>${esc([c.billing_city,c.billing_province].filter(Boolean).join(', ')||'—')}</td><td>${jobs.filter(j=>Number(j.customer_id)===Number(c.id)).length}</td><td><div class="sm360-customer-actions"><button type="button" class="secondary" onclick="sm360ViewCustomer(${Number(c.id)})">View</button>${me.role!=='production'?`<button type="button" class="secondary" onclick="customerForm(${Number(c.id)})">Edit</button>`:''}${me.role==='admin'?`<details><summary aria-label="More customer actions">•••</summary><div class="sm360-customer-actions-menu"><button type="button" class="secondary" onclick="deleteCustomer(${Number(c.id)})">Delete customer</button></div></details>`:''}</div></td></tr>`}).join('')}</tbody></table></div><div id="sm360CustomerPagination" class="sm360-customer-pages" aria-live="polite"></div></div></section>`;
if(tab==='company'&&me.role==='admin')content+=`<section class="card" style="max-width:1000px"><h2>International Finance Preferences</h2><p class="hint">These are business defaults, not automatic tax compliance. Confirm registration and the applicable tax rate for each transaction. Existing issued documents retain their original values.</p><form id="sm360FinanceForm" class="formgrid"><div><label>Country (ISO two-letter code)</label><input name="country_code" maxlength="2" required placeholder="ZA"></div><div><label>Currency (two-decimal ledger)</label><select name="base_currency">${['ZAR','USD','EUR','GBP','AUD','CAD','NZD','CHF','SGD','HKD','INR','AED'].map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div><label>Locale</label><input name="locale" required placeholder="en-ZA"></div><div><label>Tax label</label><input name="tax_label" required placeholder="VAT"></div><div class="wide"><label>Tax registration number (optional)</label><input name="tax_registration" maxlength="100"></div><div class="wide"><button type="submit">Save Finance Preferences</button></div></form></section>`;
if(['documents','invoices','quotations'].includes(tab))content=`<div class="card sm360-finance-docs-card" style="width:100%;max-width:none"><h2>Create a PDF document</h2><div class="card" style="margin:12px 0;padding:14px;border:1px solid #d6a924"><b>Customer details</b><p style="margin:6px 0 10px">Every quotation needs a customer linked to its job. Add a customer, then assign that customer to the job.</p><div class="toolbar"><button type="button" class="secondary" onclick="customerForm()">+ Add customer</button><button type="button" onclick="assignDocumentCustomer()">Assign customer to selected job</button></div><p id="docCustomerHint" class="muted" style="margin:8px 0 0"></p></div><p>Saved documents are snapshots. Later changes to a job will not change an issued document.</p><div class="formgrid"><div><label>Job (must have a customer)</label><select id="docJob" onchange="updateDocCustomerHint()">${jobs.filter(j=>me.role==='admin'||j.rep_id===me.id).map(j=>`<option value="${j.id}">#${j.id} ${esc(j.title)} — ${money(j.price)}</option>`).join('')}</select></div><div><label>Document</label><select id="docKind"><option value="quote">Quotation</option><option value="invoice">Invoice</option></select></div><div><label>Tax rate % (confirm applicable local rate)</label><input id="docVat" type="number" min="0" max="100" step="0.01" value="0" required><p class="hint">No tax is assumed. Enter the confirmed rate for this document.</p></div><div><label>Quote validity (days)</label><input id="docDays" type="number" min="1" max="365" value="30"></div><div class="wide"><label>Notes / terms</label><textarea id="docNotes" rows="2" placeholder="Payment terms, lead times, exclusions"></textarea></div></div><div class="toolbar"><button onclick="createDocument()">Generate and save document</button><button class="secondary" onclick="loadDocuments()">Refresh list</button>${me.role==='admin'?'<button class="secondary" onclick="loadDocumentFinanceReport()">Financial report</button>':''}</div><p class="hint">WhatsApp opens a prepared message for you to review and send. Download the PDF and attach it manually in WhatsApp; private PDF links cannot be accessed by customers.</p><h2>Saved quotations & invoices</h2><div id="documentList">Loading…</div><div id="sm360DraftList"></div>${me.role==='admin'?`<div class="card"><h3>Customer statement</h3><p class="hint">Admin only. Active invoices and allocated payments.</p><select id="statementCustomer"><option value="">Select customer</option>${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="secondary" onclick="loadCustomerStatement()">View statement</button><div id="customerStatementResult" aria-live="polite"></div></div><div class="card"><h3>Credit Notes</h3><p class="hint">Admin only. Credits reduce outstanding balances; refunds are handled separately.</p><select id="creditInvoice"><option value="">Select invoice</option></select><label>Credit amount</label><input id="creditAmount" type="number" min="0.01" step="0.01" placeholder="0.00"><label>Reason</label><textarea id="creditReason" rows="2" placeholder="Reason for credit (required)"></textarea><div class="toolbar"><button onclick="createCreditNote()">Issue credit note</button><button class="secondary" onclick="loadCreditNotes()">Refresh credits</button></div><div id="creditNotesList" aria-live="polite"></div></div><div id="documentFinanceReport" aria-live="polite"></div>`:''}</div>`;
if(tab==='quotations')content=`<div class="sm360-job-main-tabs"><button type="button" class="sm360-job-main-active" aria-current="page">Quotes</button><button type="button" class="secondary" onclick="go('jobs')">Active Jobs</button></div>`+content;
if(tab==='whatsapp')content=`<div class="card" style="max-width:1050px"><h2>WhatsApp Business Inbox — Preview</h2><p><span class="pill">NOT CONNECTED</span> Your existing +27 WhatsApp Business phone remains unchanged. No messages are sent or received through SignMaster 360.</p><div class="card" style="margin:12px 0"><h3>Connection settings</h3><p><b>Preferred setup:</b> WhatsApp Business App + Cloud API coexistence (same number).</p><p><b>Activation:</b> Disabled until your number's eligibility is verified with Meta. Do not migrate or disconnect your phone number.</p><p class="hint">This is a preparation workspace only. It does not connect to Meta or store API credentials.</p></div><div class="formgrid"><div><label>Customer</label><select id="waInboxCustomer" onchange="loadWaInboxDrafts()"><option value="">Choose a customer</option>${customers.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.phone)}</option>`).join('')}</select></div><div><label>Draft message</label><textarea id="waInboxMessage" rows="5" maxlength="1800" placeholder="Type a draft for this customer. It will NOT be sent."></textarea></div></div><div class="toolbar"><button onclick="saveWaInboxDraft()">Save draft (not send)</button><button class="secondary" onclick="loadWaInboxDrafts()">Refresh drafts</button></div><h3>Saved drafts</h3><div id="waInboxDrafts">Choose a customer to see your drafts.</div><p class="hint">Drafts are private to your staff account. Incoming messages, delivery status, media, and automated sends will be added only after official API activation.</p></div>`;
if(tab==='vehicles')content=`<div class="card"><h2>Vehicle Catalogue & Measurements</h2><p class="hint">Shared reference catalogue plus private business measurements. Unverified dimensions must never be used as cutting measurements.</p><div class="toolbar"><input id="vehicleSearch" placeholder="Search make or model" oninput="smVehicleFilter()"><button type="button" onclick="smVehicleForm()">+ Add Vehicle</button></div><div class="toolbar" style="gap:8px;flex-wrap:wrap"><select id="smVehicleScope" aria-label="Catalogue library" onchange="smVehicleFilter()"><option value="all">All vehicles</option><option value="private">My saved vehicles</option><option value="master">Shared references</option></select><select id="smVehicleStatus" aria-label="Measurement status" onchange="smVehicleFilter()"><option value="all">All measurements</option><option value="missing">Wheelbase missing</option><option value="entered">Wheelbase entered</option><option value="templates">Has uploaded templates</option></select><button type="button" class="secondary" onclick="smVehicleExportCsv()">Export my vehicles CSV</button></div><div id="smVehicleSummary" class="hint" aria-live="polite"></div><div id="smVehicleResults">Loading catalogue…</div></div>`;
if(tab==='production_workspace')content=`<section class="card" style="width:100%;max-width:none;box-sizing:border-box"><h2>Production Management & Stock Controller</h2><p>View workshop jobs and adjust material quantities. Financial information and job editing are restricted.</p><div class="toolbar" style="gap:10px"><button type="button" id="productionJobsTab" onclick="productionSwitch('jobs')">Workshop Display</button><button type="button" id="productionStockTab" class="secondary" onclick="productionSwitch('stock')">Stock List</button></div><div id="productionJobsPane"><iframe title="Live Workshop Display" src="/workshop-display" style="display:block;width:100%;height:calc(100vh - 280px);min-height:640px;border:1px solid #315772;border-radius:14px;background:#091625" loading="eager"></iframe></div><div id="productionStockPane" hidden><div id="stockContent">Loading stock…</div></div></section>`;

if(tab==='payments')content=`<div class="card sm360-payments-card"><h2>Job Payments</h2><p>Track job prices, deposits and outstanding balances. Record additional payments here. Payments are recorded manually; no bank connection is used.</p><div class="sm360-search-panel sm360-payment-search"><input id="paymentSearch" type="search" placeholder="Search customer, job, invoice, reference or amount..." value="${esc(sm360PaymentQuery)}" oninput="sm360PaymentQuery=this.value;sm360PaymentPage=1;filterPaymentRows()" aria-label="Search payments"><select id="paymentStatusFilter" onchange="sm360PaymentStatus=this.value;sm360PaymentPage=1;filterPaymentRows()" aria-label="Filter payment status"><option value="all" ${sm360PaymentStatus==='all'?'selected':''}>All payment statuses</option><option value="unpaid" ${sm360PaymentStatus==='unpaid'?'selected':''}>Unpaid</option><option value="partial" ${sm360PaymentStatus==='partial'?'selected':''}>Partially paid</option><option value="paid" ${sm360PaymentStatus==='paid'?'selected':''}>Paid in full</option></select></div><div id="paymentSummary">Loading invoices…</div><div id="paymentDetails"></div></div>`;

let sm360OutstandingRequest=0;
async function loadDashboardOutstanding(){
  const target=document.querySelector('[data-dashboard-key="payments"] .stat');

  const request=++sm360OutstandingRequest;
  try{
    const data=await api('/payments/outstanding-total');

}
function sm360JobCreatedDate(value){
 if(value===null||value===undefined||value==='')return '—';
 let date;
 if(typeof value==='number'||/^\d{10,13}$/.test(String(value))){const n=Number(value);date=new Date(n<1e12?n*1000:n)}
 else date=new Date(String(value));
 if(Number.isNaN(date.getTime()))return '—';
 return date.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function jobTable(data){return `<div class="tablewrap"><table><thead><tr><th>Date Created</th><th>Job</th><th>Customer</th><th>Sales rep</th><th>Assigned</th><th>Status</th><th>Job Value</th><th>Amount Paid</th><th>Balance Due</th><th>Due</th><th>WhatsApp</th><th>Email</th></tr></thead><tbody>${data.map(j=>{let b=jobBalances[String(j.id)];let visible=me.role==='admin'||(me.role==='sales'&&(j.rep_id===me.id||Boolean(b)));let paid=visible?(b?money(b.paid_cents/100):'—'):'—';let balance=visible?(b?money(b.balance_cents/100):'—'):'—';return `<tr style="cursor:pointer" onclick="jobForm(${j.id})"><td>${esc(sm360JobCreatedDate(j.created_at))}</td><td><b>#${j.id}</b> ${esc(j.title)}</td><td>${esc(j.customer_name||'—')}</td><td>${esc(j.rep_name)}</td><td>${esc(j.assigned_name||'—')}</td><td><span class="pill">${esc(isCompletedStatus(j.status)?'Collected':statusLabel(j.status))}</span></td><td>${money(j.price)}</td><td>${paid}</td><td><b>${balance}</b></td><td>${esc(j.due_date||'—')}</td><td><button class="secondary" onclick="event.stopPropagation();shareJobWhatsApp(${j.id})">Send update</button></td><td><button class="secondary" onclick="event.stopPropagation();sm360PrepareJobEmail(${j.id})">Send email</button></td></tr>`}).join('')}</tbody></table></div>`}

function jobGroupTabs(){let active=jobs.filter(j=>j.status!=='Quote'&&!isCompletedStatus(j.status)),staff=users.filter(u=>['admin','sales'].includes(u.role)&&(u.active||active.some(j=>j.rep_id===u.id))).sort((a,b)=>a.name.localeCompare(b.name));let tabs=[['all','All Jobs',active.length],...staff.map(u=>['staff:'+u.id,u.name,active.filter(j=>j.rep_id===u.id).length]),['completed','Collected',jobs.filter(j=>isCompletedStatus(j.status)).length]];return `<div class="sm360-jobtabs">${tabs.map(([key,name,count])=>`<button type="button" class="secondary ${jobGroup===key?'sm360-selected':''}" onclick="selectJobGroup('${key}')">${esc(name)} (${count})</button>`).join('')}</div>`}

function jobAlertItems(){if(['stock_controller','production'].includes(me.role))return [];let today=new Date(),day=new Date(today.getFullYear(),today.getMonth(),today.getDate());return jobs.filter(j=>j.due_date&&!isCompletedStatus(j.status)&&j.status!=='Cancelled'&&(me.role==='admin'||j.rep_id===me.id||j.assigned_id===me.id)).map(j=>{let due=new Date(j.due_date+'T12:00:00');if(Number.isNaN(due.getTime()))return null;let diff=Math.round((new Date(due.getFullYear(),due.getMonth(),due.getDate())-day)/86400000);return diff<=1?{job:j,diff}:null}).filter(Boolean).sort((a,b)=>a.diff-b.diff)}
/* Reminders are per signed-in user and business. Snoozes/dismissals affect only this browser. */
let sm360ReminderSessionSeen=new Set();
let sm360ReminderLastHourlyAt=0;
let sm360ReminderAudioContext=null;
function sm360ReminderUnlockAudio(){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;sm360ReminderAudioContext=sm360ReminderAudioContext||new C();if(sm360ReminderAudioContext.state==='suspended')sm360ReminderAudioContext.resume().catch(()=>{});}catch(_){}
}
// Browsers require a user gesture before audible alerts. Sign-in and ordinary clicks unlock audio.
document.addEventListener('pointerdown',sm360ReminderUnlockAudio,{passive:true});
document.addEventListener('keydown',sm360ReminderUnlockAudio);
function sm360ReminderSound(){
 try{const ctx=sm360ReminderAudioContext;if(!ctx||ctx.state!=='running')return;
  const t=ctx.currentTime;
  [0,0.22,0.48].forEach((offset,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(i===1?740:880,t+offset);gain.gain.setValueAtTime(0.0001,t+offset);gain.gain.exponentialRampToValueAtTime(0.12,t+offset+0.02);gain.gain.exponentialRampToValueAtTime(0.0001,t+offset+0.18);osc.connect(gain);gain.connect(ctx.destination);osc.start(t+offset);osc.stop(t+offset+0.2)});
 }catch(e){console.warn('Reminder sound unavailable:',e)}
}
function sm360ReminderScope(){return 'sm360-job-reminder-v1:'+String(me?.business_id??'business')+':'+String(me?.id??'user')+':';}
function sm360ReminderRead(jobId){try{return JSON.parse(localStorage.getItem(sm360ReminderScope()+jobId)||'{}')}catch(_){return {}}}
function sm360ReminderWrite(jobId,patch){try{localStorage.setItem(sm360ReminderScope()+jobId,JSON.stringify({...sm360ReminderRead(jobId),...patch}))}catch(_){}}
function sm360ReminderToday(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function sm360ReminderEligible(){let now=Date.now(),today=sm360ReminderToday();return jobAlertItems().filter(({job})=>{let state=sm360ReminderRead(job.id);return state.dismissedDay!==today&&!(Number(state.snoozedUntil)>now)})}
function sm360ReminderPopupClose(){document.getElementById('sm360ReminderPopup')?.remove()}
function sm360ReminderOpenJob(id){sm360ReminderSessionSeen.add(String(id));sm360ReminderPopupClose();jobForm(id)}
function sm360ReminderSnooze(id){sm360ReminderWrite(id,{snoozedUntil:Date.now()+60*60*1000});sm360ReminderSessionSeen.add(String(id));sm360ReminderPopupRender(false)}
function sm360ReminderDismiss(id){sm360ReminderWrite(id,{dismissedDay:sm360ReminderToday()});sm360ReminderSessionSeen.add(String(id));sm360ReminderPopupRender(false)}
function sm360ReminderDismissAll(){for(const {job} of sm360ReminderEligible()){sm360ReminderWrite(job.id,{dismissedDay:sm360ReminderToday()});sm360ReminderSessionSeen.add(String(job.id))}sm360ReminderPopupClose()}
function sm360ReminderPopupRender(auto=false){
 if(!me||!document.getElementById('jobBellMount'))return;
 const existing=document.getElementById('sm360ReminderPopup');
 if(auto&&existing)return;
 const eligible=sm360ReminderEligible();
 // Show immediately on login and then once per hour, even for previously seen jobs.
 if(auto&&sm360ReminderLastHourlyAt&&Date.now()-sm360ReminderLastHourlyAt<60*60*1000)return;

function modal(html){let d=document.createElement('div');d.className='modalback';d.id='modal';d.innerHTML=`<div class="modal"><div class="sm83-modal-top"><button type="button" class="sm83-modal-close" aria-label="Close window" title="Close window" onclick="closeModal()">&times;</button></div><div class="sm83-modal-body">${html}</div></div>`;/* Do not dismiss by clicking or dragging outside the dialog. */d.style.zIndex=String(10000+document.querySelectorAll('.modalback').length*10);document.body.append(d);const forms=[...d.querySelectorAll('form')];d.dataset.modalDirty='false';const initial=forms.map(f=>JSON.stringify([...new FormData(f).entries()]));const updateDirty=()=>{d.dataset.modalDirty=String(forms.some((f,i)=>JSON.stringify([...new FormData(f).entries()])!==initial[i]))};forms.forEach(f=>{f.addEventListener('input',updateDirty);f.addEventListener('change',updateDirty)});let form=d.querySelector('#jobForm');if(form){d.dataset.jobInitial=JSON.stringify([...new FormData(form).entries()]);d.dataset.jobDirty='false';form.addEventListener('input',()=>{d.dataset.jobDirty=String(JSON.stringify([...new FormData(form).entries()])!==d.dataset.jobInitial)});form.addEventListener('change',()=>{d.dataset.jobDirty=String(JSON.stringify([...new FormData(form).entries()])!==d.dataset.jobInitial)})}}function sm360Notice(message){

 const prior=document.activeElement;

 ok.onclick=finish;actions.append(ok);dialog.append(heading,body,actions);layer.append(dialog);document.body.append(layer);

function sm360ConfirmDialog(message,opts={}){
 return new Promise(resolve=>{
  const layer=document.createElement('div');layer.className='sm360-dialog-overlay';
  const dialog=document.createElement('section');dialog.className='sm360-dialog';
  dialog.setAttribute('role','alertdialog');dialog.setAttribute('aria-modal','true');
  const title=document.createElement('h2');title.textContent=opts.title||'Please confirm';
  const desc=document.createElement('p');desc.textContent=String(message);
  dialog.setAttribute('aria-labelledby','sm360ConfirmHeading');title.id='sm360ConfirmHeading';
  const actions=document.createElement('div');actions.className='sm360-dialog-actions';
  const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent=opts.cancel||'Cancel';
  const accept=document.createElement('button');accept.type='button';accept.className=opts.danger?'danger':'';accept.textContent=opts.accept||'Confirm';
  const prior=document.activeElement;
  const finish=(value)=>{document.removeEventListener('keydown',onKey,true);layer.remove();if(prior?.isConnected)prior.focus();resolve(value)};
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();finish(false)}else if(e.key==='Tab'){const items=[cancel,accept];const at=items.indexOf(document.activeElement);if(e.shiftKey&&at===0){e.preventDefault();accept.focus()}else if(!e.shiftKey&&at===1){e.preventDefault();cancel.focus()}}};
  cancel.onclick=()=>finish(false);accept.onclick=()=>finish(true);
  actions.append(cancel,accept);dialog.append(title,desc,actions);layer.append(dialog);document.body.append(layer);
  document.addEventListener('keydown',onKey,true);cancel.focus();
 })
}

function sm82Calculate(){
 const form=document.querySelector('#jobForm');if(!form)return null;
 const width=Number(form.elements.namedItem('width_mm')?.value);
 const height=Number(form.elements.namedItem('height_mm')?.value);
 const quantity=Number(form.elements.namedItem('quantity')?.value);
 const rate=Number(document.getElementById('sm82CalcRate')?.value);
 const unit=document.getElementById('sm82CalcUnit')?.value||'mm';
 const vat=document.getElementById('sm82CalcVat')?.value||'add';
 const taxRate=Number(document.getElementById('sm82CalcTaxRate')?.value);
 const validTax=Number.isFinite(taxRate)&&taxRate>=0&&taxRate<=100;
 const valid=[width,height,quantity,rate].every(Number.isFinite)&&width>0&&height>0&&quantity>0&&rate>=0&&validTax;
 const factor=unit==='m'?1:unit==='cm'?10000:1000000;
 const area=valid?width*height/factor:0;
 const base=area*quantity*rate;
 const multiplier=1+taxRate/100;
 const subtotal=vat==='included'?base/multiplier:base;
 const tax=vat==='none'?0:vat==='included'?base-subtotal:base*taxRate/100;
 const total=vat==='add'?base+tax:base;
 const money=n=>n.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
 const set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value};
 set('sm82CalcArea',area.toFixed(4)+' m²');set('sm82CalcTotalArea',(area*quantity).toFixed(4)+' m²');
 set('sm82CalcSubtotal',money(subtotal));set('sm82CalcTax',money(tax));set('sm82CalcTotal',money(total));
 return valid&&Number.isFinite(total)?total:null;
}
function sm82ApplyPrice(){

 const field=document.querySelector('#jobForm [name="price"]');if(!field)return;
 field.value=(Math.round((value+Number.EPSILON)*100)/100).toFixed(2);
 field.dispatchEvent(new Event('input',{bubbles:true}));
 field.scrollIntoView({block:'center',behavior:'smooth'});
}

function sm360PasteArtwork(event){
 if(event.defaultPrevented || !event.clipboardData)return;
 const target=event.target;
 if(target?.closest?.('input,textarea,select,[contenteditable], [role="textbox"]'))return;
 const dialogs=Array.from(document.querySelectorAll('.modalback'));
 const active=dialogs.at(-1);
 if(!active)return;
 const zone=active.querySelector('.sm360-art-drop[data-art-input]');
 if(!zone)return;
 const id=zone.dataset.artInput;
 const input=document.getElementById(id);

function sm360WaPhone(raw){
  const digits=String(raw||'').replace(/\D/g,'');
  if(/^0\d{9}$/.test(digits))return '27'+digits.slice(1);
  if(/^27\d{9}$/.test(digits))return digits;
  if(/^00\d{9,14}$/.test(digits))return digits.slice(2);
  if(/^\d{10,15}$/.test(digits))return digits;
  return '';
}

function sm360WaCompose(customer,message,documentId){

  if(!number)return sm360Notice('Please add a valid WhatsApp telephone number to this customer under Customers. South African numbers can start with 0 or +27.');
  const info=documentId?'<p class="hint">Download the quotation/invoice PDF from the document list, then attach the PDF inside WhatsApp. This message does not include a private app link.</p>':'';

async function sm360WaOpen(number){
  if(sm360WaOpening)return;
  const msg=document.getElementById('waMessage')?.value.trim();
  if(!msg)return sm360Notice('Enter a message.');
  sm360WaOpening=true;
  const button=document.querySelector('#modal .actions button');
  if(button)button.disabled=true;
  try{
    // Hand off directly to the installed WhatsApp Desktop protocol handler.
    // The browser/Windows may request permission; sending remains manual.
    // Never open WhatsApp Web automatically or create an extra browser tab.
    const url='whatsapp://send?phone='+encodeURIComponent(number)+'&text='+encodeURIComponent(msg);
    const link=document.createElement('a');
    link.href=url;
    link.style.display='none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    // Browsers cannot reliably detect whether a desktop protocol handler exists.
    // Offer the official download page if the user remains in the browser.
    // Keep the prepared message in the modal so it can be retried after installation.
    setTimeout(()=>{
      if(document.visibilityState==='hidden')return;
      const dialog=document.getElementById('modal');
      if(!dialog||!document.getElementById('waMessage')||document.getElementById('sm360WaDownload'))return;
      const notice=document.createElement('div');

async function sm360PreparePaymentUpdate(jobId,channel){

function sm360EnsureFinancialUpdate(message,job,summary){
 let result=String(message||'');
 // Older saved templates may omit the financial fields; preserve their wording.
 const amount=summary?money(Number(summary.job_value_cents||0)/100):'Not available';
 const paid=summary?money(Number(summary.paid_cents||0)/100):'Not available';
 const balance=summary?money(Number(summary.balance_cents||0)/100):'Not available';
 const missing=[];
 if(!/Job\s*Value\s*:/i.test(result))missing.push('Job Value: '+amount);
 if(!/Amount\s*Paid\s*:/i.test(result))missing.push('Amount Paid: '+paid);
 if(!/Balance\s*Due\s*:/i.test(result))missing.push('Balance Due: '+balance);
 if(missing.length){
   const closing=/\n\s*(?:Thank you|Kind regards|Regards)[,.!]?/i;
   const match=closing.exec(result);
   if(match)result=result.slice(0,match.index)+'\n\n'+missing.join('\n')+'\n'+result.slice(match.index);
   else result+='\n\n'+missing.join('\n');
 }
 // Customer-facing job numbers are written without a leading hash.
 return result.replace(/#\s*(?=\d+\b)/g,'');
}

d>${esc(p.method)}</td><td>${esc(p.reference)}</td><td>${esc(p.recorded_by_name)}</td><td>${p.reversed_at?'Reversed: '+esc(p.reversal_reason):'Recorded'}</td><td>${me.role==='admin'&&!p.reversed_at?`<button class="secondary" onclick="editInvoicePayment(${p.id},${id},${p.amount_cents})">Edit Amount</button> <button class="secondary" onclick="deleteInvoicePayment(${p.id},${id})" style="background:#b42332;color:white">Delete Payment</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p>No payments recorded yet.</p>'}${me.role==='admin'&&data.corrections?.length?`<h3>Payment correction history</h3><div class="tablewrap"><table><thead><tr><th>Payment</th><th>Previous</th><th>Corrected</th><th>Admin</th><th>Reason</th><th>Date</th></tr></thead><tbody>${data.corrections.map(c=>`<tr><td>#${c.payment_id}</td><td>${paymentZar(c.previous_amount_cents)}</td><td>${paymentZar(c.new_amount_cents)}</td><td>${esc(c.corrected_by_name)}</td><td>${esc(c.reason)}</td><td>${new Date(c.corrected_at*1000).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`}catch(e){el.textContent='Unable to load payment details: '+e.message;notify(e)}}
async function correctInvoicedJobValue(docId){
 if(me.role!=='admin')return sm360Notice('Only an administrator may correct invoiced job values.');
 try{
  const data=await api('/documents/'+docId+'/payments');
  const a=data.summary;
  const price=prompt('CURRENT INVOICE: '+paymentZar(a.total_cents)+'\n\nEnter the CORRECT FINAL JOB VALUE in rand (for example 380.00):','');
  if(price===null)return;
  if(!/^\d+(?:\.\d{1,2})?$/.test(price.trim()))throw Error('Enter a valid amount, e.g. 380.00');
  const cents=Math.round(Number(price)*100);
  const reason=prompt('Reason for correcting the job and invoice value (at least 5 characters):','Incorrect original job price');
  if(reason===null)return;
  if(reason.trim().length<5)throw Error('A correction reason is required');
  let payload={job_value:price.trim(),reason:reason.trim()};
  if(a.paid_cents>cents){
   if(data.payments.length!==1)throw Error('Several payments exist. Correct them individually before reducing the invoice total.');
   const pay=data.payments[0];
   const corrected=prompt('The recorded payment '+paymentZar(pay.amount_cents)+' EXCEEDS the corrected job value.\n\nEnter the amount ACTUALLY received (e.g. 380.00). This will correct the payment and invoice together:','');
   if(corrected===null)return;
   if(!/^\d+(?:\.\d{1,2})?$/.test(corrected.trim())||Number(corrected)<=0)throw Error('Enter a valid positive payment amount');
   payload.payment_id=pay.id;payload.payment_amount=corrected.trim();
  }
  if(!confirm('Confirm administrator correction?\nJob and invoice: '+paymentZar(a.total_cents)+' → '+paymentZar(cents)+'\n'+(payload.payment_id?'Payment: '+paymentZar(data.payments[0].amount_cents)+' → R '+payload.payment_amount+'\n':'')+'The original figures will be retained in the audit history.'))return;
  await api('/documents/'+docId+'/correct-job-value',{method:'PATCH',body:JSON.stringify(payload)});
  await refresh();go('payments');await loadPaymentSummaries();await openInvoicePayments(docId);
  sm360Notice('Job and invoice corrected. Verify the updated totals below.');
 }catch(e){notify(e)}
}
async function saveInvoicePayment(id){let b=$('#savePaymentBtn');if(b)b.disabled=true;try{let amount=$('#payAmount').value;if(!amount||Number(amount)<=0)throw Error('Enter a positive amount');if(!confirm('Confirm receipt of R '+amount+'? Only record money actually received.'))return;await api('/documents/'+id+'/payments',{method:'POST',body:JSON.stringify({amount,method:$('#payMethod').value,reference:$('#payReference').value,note:$('#payNote').value})});await loadPaymentSummaries();await openInvoicePayments(id)}catch(e){notify(e)}finally{if(b)b.disabled=false}}
async function editInvoicePayment(paymentId,docId,oldCents){
 if(me.role!=='admin')return sm360Notice('Only the business admin can correct payments.');
 // Start with a BLANK field: preselecting R 3 800,00 led to accidental
 // confirmation of the old amount instead of the intended R 380,00.
 const amount=prompt('CURRENT PAYMENT: '+paymentZar(oldCents)+'\n\nEnter the CORRECT amount received in rand (example: 380.00).\nThis field is intentionally blank:','');
 if(amount===null)return;
 const cleaned=amount.trim().replace(/\s/g,'').replace(',','.');
 if(!/^\d+(?:\.\d{1,2})?$/.test(cleaned)||Number(cleaned)<=0)return sm360Notice('Enter a positive amount, for example 380.00');
 const newCents=Math.round(Number(cleaned)*100);
 if(newCents===oldCents)return sm360Notice('The corrected amount is the same as the current payment. No changes were saved.');
 const reason=prompt('Reason for correcting this payment (at least 5 characters):');if(reason===null)return;
 if(reason.trim().length<5)return sm360Notice('Please enter a reason of at least 5 characters.');
 if(!confirm('PLEASE VERIFY\n\nCurrent recorded payment: '+paymentZar(oldCents)+'\nNew corrected payment: '+paymentZar(newCents)+'\n\nOnly choose OK if the NEW amount is correct.'))return;
 try{
  const result=await api('/payments/'+paymentId+'/amount',{method:'PATCH',body:JSON.stringify({amount:cleaned,reason:reason.trim()})});
  if(!result.ok||result.payment_amount_cents!==newCents)throw Error('The server did not confirm the corrected payment amount. Please reload and check the record.');
  const fresh=await api('/documents/'+docId+'/payments');
  const saved=fresh.payments.find(p=>p.id===paymentId);
  if(!saved||saved.amount_cents!==newCents)throw Error('Payment correction was submitted but the saved amount could not be verified. Refresh before attempting another correction.');
  await loadPaymentSummaries();await openInvoicePayments(docId);
  sm360Notice('Payment corrected and verified.\n\nOld: '+paymentZar(oldCents)+'\nNew: '+paymentZar(newCents)+'\nInvoice received: '+paymentZar(fresh.summary.paid_cents)+'\nInvoice outstanding: '+paymentZar(fresh.summary.balance_cents));
 }catch(e){notify(e)}
}
async function deletePaymentJob(jobId){
  if(me.role!=='admin')return;
  const reason=prompt('Reason for deleting this job and its linked financial records (minimum 5 characters):');
  if(reason===null)return;
  if(reason.trim().length<5)return sm360Notice('Please enter a reason of at least 5 characters.');
  if(!confirm('DELETE JOB #'+jobId+' AND ALL LINKED INVOICES/PAYMENTS FROM ACTIVE RECORDS?\nAn audit snapshot will be retained. This cannot be undone in the interface.'))return;
  try{await api('/jobs/'+jobId,{method:'DELETE',body:JSON.stringify({reason:reason.trim()})});await refresh();await loadPaymentSummaries();const details=$('#paymentDetails');if(details)details.innerHTML='';}
  catch(e){notify(e)}
}
async function deleteInvoicePayment(paymentId,docId){let reason=prompt('Reason for deleting this payment (minimum 5 characters):');if(reason===null)return;if(reason.trim().length<5)return sm360Notice('Please enter a reason of at least 5 characters.');if(!confirm('Delete this payment from the Payments list? The invoice balance will increase. An audit record will be retained.'))return;try{await api('/payments/'+paymentId,{method:'DELETE',body:JSON.stringify({reason:reason.trim()})});await loadPaymentSummaries();await openInvoicePayments(docId)}catch(e){notify(e)}}
async function reverseInvoicePayment(paymentId,docId){let reason=prompt('Reason for reversing this payment (minimum 5 characters):');if(reason===null)return;if(reason.trim().length<5)return sm360Notice('Please provide a clear reason.');if(!confirm('Remove this payment from active totals? The original payment stays in the audit history, and the outstanding balance increases.'))return;try{await api('/payments/'+paymentId+'/reverse',{method:'POST',body:JSON.stringify({reason})});await loadPaymentSummaries();await openInvoicePayments(docId)}catch(e){notify(e)}}

// Voice Control sub-tabs: switch panels without re-rendering the application or stopping the microphone.
function smVoiceShowPanel(panel){
 const commands=panel==='commands';
 const a=document.getElementById('smVoiceControlPanel'),b=document.getElementById('smVoiceCommandsPanel');
 if(!a||!b)return;
 a.style.display=commands?'none':'';b.style.display=commands?'':'none';
 const control=document.getElementById('smVoiceControlTab'),list=document.getElementById('smVoiceCommandsTab');
 if(control){control.classList.toggle('secondary',commands);control.setAttribute('aria-selected',String(!commands));}
 if(list){list.classList.toggle('secondary',!commands);list.setAttribute('aria-selected',String(commands));}
}
// SignMaster Voice Control v1: safe navigation only; separate from legacy job dictation.
let smVoiceRecognizer=null,smVoiceWake=false,smVoiceManual=false,smVoiceRestart=null,smVoiceSpeech=true,smVoiceArmed=false,smVoiceSpeaking=false,smVoiceGeneration=0;
function smVoiceStopSpeaking(){smVoiceGeneration++;smVoiceSpeaking=false;if('speechSynthesis' in window)window.speechSynthesis.cancel();if(smVoiceWake&&!smVoiceRecognizer)smVoiceScheduleRestart();}
function smVoiceScheduleRestart(){if(!smVoiceWake||smVoiceSpeaking||smVoiceRecognizer||smVoiceRestart||document.visibilityState!=='visible')return;smVoiceRestart=setTimeout(()=>{smVoiceRestart=null;if(smVoiceWake&&!smVoiceSpeaking&&!smVoiceRecognizer)smVoiceStart(true,true)},450);}
function smVoiceToggleSpeech(){smVoiceSpeech=!smVoiceSpeech;smVoiceStopSpeaking();const b=document.getElementById('smVoiceSpeechButton');if(b)b.textContent=smVoiceSpeech?'🔊 Spoken replies: On':'🔇 Spoken replies: Off';smVoiceStatus('Spoken replies '+(smVoiceSpeech?'enabled':'disabled')+'.');}
function smVoiceSay(message){
 smVoiceStatus(message);
 if(!smVoiceSpeech||!('speechSynthesis' in window))return;
 const generation=++smVoiceGeneration;smVoiceSpeaking=true;
 // Pause recognition while SignMaster talks so its own voice is not treated as a command.
 if(smVoiceRestart){clearTimeout(smVoiceRestart);smVoiceRestart=null;}
 const r=smVoiceRecognizer;smVoiceRecognizer=null;
 if(r){r.onend=null;try{r.abort()}catch(e){}}
 try{
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(message);u.lang='en-ZA';u.rate=0.96;
  const finished=()=>{if(generation!==smVoiceGeneration)return;smVoiceSpeaking=false;smVoiceScheduleRestart();};
  u.onend=finished;u.onerror=finished;
  window.speechSynthesis.speak(u);
 }catch(e){console.warn('Speech output unavailable',e);if(generation===smVoiceGeneration){smVoiceSpeaking=false;smVoiceScheduleRestart();}}
}
function smVoiceReadHelp(){smVoiceSay('You can ask about customer balances, open sections, or create a new job. With a job form open say: set title to vinyl banner, set width to 1200 millimetres, set height to 800 millimetres, set quantity to 2, set price to 950 rand, set production instructions to laminate and trim, or read job draft. You must review and save the job yourself.');}
function smVoiceMoney(cents){return 'R '+(Number(cents||0)/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function smVoiceFinance(command){
 if(['production','stock_controller','viewer'].includes(me.role)){smVoiceSay('Your account does not have access to financial voice queries.');return;}
 smVoiceStatus('Checking live balances for your business…');
 try{
  const rows=await api('/payments/summary');
  if(!Array.isArray(rows))throw Error('Payment summary unavailable');
  const c=command.toLowerCase().replace(/[?.!,]/g,' ').replace(/\s+/g,' ').trim();
  const balance=rows.filter(r=>Number(r.balance_cents)>0);
  const sum=(arr,key)=>arr.reduce((n,r)=>n+Number(r[key]||0),0);
  const job=c.match(/(?:job|invoice)\s*(?:number|#|no\.?|number is)?\s*#?\s*(\d+)/);
  if(job){const matches=rows.filter(r=>String(r.job_id)===job[1]||String(r.number||'').toLowerCase()===job[1]);if(!matches.length){smVoiceSay('I could not find a payment record for job '+job[1]+'.');return;}smVoiceSay('Job '+job[1]+' has '+smVoiceMoney(sum(matches,'balance_cents'))+' outstanding, with '+smVoiceMoney(sum(matches,'paid_cents'))+' paid.');return;}
  let name=c.match(/(?:what does|how much does|balance for|outstanding for|owed by|owe by|does)\s+(.+?)\s+(?:owe|owes|outstanding|balance|me)?$/);
  if(name){let term=name[1].replace(/\b(customer|client|the|me|money|amount|does|is|for)\b/g,' ').trim();if(term.length>=2){const matches=rows.filter(r=>String(r.customer_name||'').toLowerCase().includes(term));if(!matches.length){smVoiceSay('No payment records found for '+term+'.');return;}const names=[...new Set(matches.map(r=>String(r.customer_name||'').trim().toLowerCase()))];if(names.length>1){smVoiceSay('I found several customers matching '+term+'. Please say a more specific name.');return;}smVoiceSay(matches[0].customer_name+' owes '+smVoiceMoney(sum(matches,'balance_cents'))+'. Total paid is '+smVoiceMoney(sum(matches,'paid_cents'))+'.');return;}}
  if(/\b(who|which customers|list|top)\b/.test(c)&&/\b(owe|owes|owing|outstanding|unpaid)\b/.test(c)){
   const groups=new Map();for(const r of balance){const k=String(r.customer_name||'Unknown customer');groups.set(k,(groups.get(k)||0)+Number(r.balance_cents||0));}
   const top=[...groups].sort((a,b)=>b[1]-a[1]).slice(0,5);
   smVoiceSay(top.length?'There are '+groups.size+' customers with outstanding balances. The top '+top.length+' are: '+top.map(([n,v])=>n+', '+smVoiceMoney(v)).join('; ')+'.':'No outstanding balances were found.');return;
  }
  if(/\b(paid|received|collected)\b/.test(c)&&!/\b(unpaid|not paid)\b/.test(c)){smVoiceSay('Total payments recorded on the available payment summaries are '+smVoiceMoney(sum(rows,'paid_cents'))+'.');return;}
  const customers=new Set(balance.map(r=>String(r.customer_name||'Unknown customer').toLowerCase()));
  smVoiceSay('The total outstanding balance is '+smVoiceMoney(sum(rows,'balance_cents'))+', across '+customers.size+' customers with unpaid balances.');
 }catch(e){smVoiceSay('I could not retrieve the balances. '+(e.status===403?'Your account does not have permission.':'Please check your connection or open Payments to verify.'));}
}

function smVoiceStatus(message){const e=document.getElementById('smVoiceStatus');if(e)e.textContent=message;}
function smVoiceStopSpeakingSilently(){if('speechSynthesis' in window)try{window.speechSynthesis.cancel()}catch(e){}}
function smVoiceStop(){smVoiceGeneration++;smVoiceSpeaking=false;smVoiceStopSpeakingSilently();smVoiceWake=false;smVoiceManual=false;smVoiceArmed=false;if(smVoiceRestart){clearTimeout(smVoiceRestart);smVoiceRestart=null;}const r=smVoiceRecognizer;smVoiceRecognizer=null;if(r){r.onend=null;try{r.abort()}catch(e){}}smVoiceStatus('Microphone off.');const b=document.getElementById('smVoiceWakeButton');if(b)b.textContent='Enable wake listening';}
function smVoiceToggleWake(){if(smVoiceWake){smVoiceStop();return;}smVoiceStart(true);}
function smVoiceStart(wake,restarting=false){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){smVoiceStatus('Speech recognition is not supported in this browser. Try Chrome or Edge on HTTPS.');return;}
 if(!restarting){smVoiceStop();smVoiceWake=!!wake;smVoiceManual=!wake;smVoiceArmed=false;}
 if(smVoiceRestart){clearTimeout(smVoiceRestart);smVoiceRestart=null;}
 if(smVoiceSpeaking){smVoiceScheduleRestart();return;}
 const b=document.getElementById('smVoiceWakeButton');if(b)b.textContent=smVoiceWake?'Disable wake listening':'Enable wake listening';
 const r=new SR();smVoiceRecognizer=r;r.lang='en-ZA';r.continuous=!!wake;r.interimResults=false;try{r.maxAlternatives=1;}catch(e){}
 r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){
   if(!e.results[i].isFinal)continue;
   const heard=String(e.results[i][0].transcript||'').trim();
   const match=heard.match(/(?:hey|hi|okay|ok)\s+sign\s*master\b[\s,.:;!]*(.*)/i);
   // Standby accepts only the wake phrase; active conversation accepts natural commands.
   if(smVoiceWake&&/\b(?:good\s*bye|goodbye|good\s*by|bye)\s+sign\s*master\b/i.test(heard)){
     smVoiceArmed=false;smVoiceSay('Goodbye. I am on standby. Say Hey SignMaster when you need me.');return;
   }
   if(smVoiceWake&&!smVoiceArmed){
     if(!match){smVoiceStatus('Standby: say Hey SignMaster to begin.');continue;}
     smVoiceArmed=true;
     if(!match[1].trim()){smVoiceSay('I am listening. What can I do for you?');return;}
   }
   const cmd=match?(match[1]||'').trim():heard;
   if(!cmd)continue;
   Promise.resolve(smVoiceCommand(cmd)).catch(e=>smVoiceSay('Sorry, that command failed.'));if(smVoiceManual){smVoiceManual=false;const old=smVoiceRecognizer;smVoiceRecognizer=null;if(old){old.onend=null;try{old.stop()}catch(e){}}break;}
 }};
 r.onerror=e=>{smVoiceStatus('Microphone: '+e.error+'. '+(e.error==='not-allowed'?'Allow microphone access in browser settings.':''));if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){smVoiceStop();smVoiceStatus('Microphone unavailable: '+e.error+'. Enable wake listening again after fixing permission or device access.');}};
 r.onend=()=>{if(smVoiceRecognizer!==r)return;smVoiceRecognizer=null;
   if(smVoiceWake){smVoiceScheduleRestart();}
   else if(!smVoiceWake)smVoiceStatus('Microphone off. Click Speak command to try again.');
 };
 try{r.start();smVoiceStatus(smVoiceWake?(smVoiceArmed?'Conversation active. Speak naturally; say Goodbye SignMaster for standby.':'Standby: say Hey SignMaster to begin.'):'Listening for a command…');}
 catch(e){smVoiceStop();smVoiceStatus('Could not start microphone: '+e.message);}
}
// Phase 3: controlled, local-only dictation into an already open job form.
// Never submits a form, selects a customer, changes a status or modifies a payment.
function smVoiceJobDraft(command){
 const form=document.getElementById('jobForm');
 if(!form||!form.isConnected)return false;
 const c=String(command).trim();
 if(/^(?:read|review|repeat|summarise|summarize|check)\s+(?:the\s+)?(?:job\s+)?(?:draft|details|form)\b/i.test(c)){
  const get=k=>String(form.elements.namedItem(k)?.value||'').trim();
  smVoiceSay('Current job draft. Title: '+(get('title')||'not entered')+'. Width '+(get('width_mm')||'0')+' millimetres, height '+(get('height_mm')||'0')+' millimetres. Quantity '+(get('quantity')||'1')+'. Price '+(get('price')||'0')+' rand. Instructions: '+(get('production_instructions')||'none')+'. Review all fields before saving.');return true;
 }
 const fields=[
  {re:/^(?:set|change|enter|update)\s+(?:the\s+)?(?:job\s+)?(?:title|name)\s+(?:to|as)\s+(.+)$/i,key:'title',max:160},
  {re:/^(?:set|change|enter|update)\s+(?:the\s+)?(?:job\s+)?(?:production\s+instructions?|instructions?|job\s+notes?|notes?)\s+(?:to|as)\s+(.+)$/i,key:null,max:1500},
  {re:/^(?:set|change|enter|update)\s+(?:the\s+)?(?:job\s+)?(width|height|quantity|price)\s+(?:to|as)\s+(.+)$/i,numeric:true}
 ];
 for(const f of fields){const m=c.match(f.re);if(!m)continue;
  let key=f.key,raw=m[1];
  if(f.numeric){key=({width:'width_mm',height:'height_mm',quantity:'quantity',price:'price'})[m[1].toLowerCase()];raw=m[2];
   // Require unambiguous digit input; don't silently guess spoken number words.
   const cleaned=raw.replace(/\s*(?:millimetres?|mm|rand|rands|zar|items?|pieces?)\s*$/i,'').replace(/\s/g,'');
   if(!/^\d+(?:[.,]\d+)?$/.test(cleaned)){smVoiceSay('Please repeat '+m[1]+' using a number, for example set width to 1200.');return true;}
   const n=Number(cleaned.replace(',','.'));
   if(!Number.isFinite(n)||n<0||(key==='quantity'&&(!Number.isInteger(n)||n<1))||(key==='price'&&n>100000000)||(key!=='price'&&n>10000000)){
    smVoiceSay('That value is outside the allowed range. Please repeat it.');return true;}
   raw=String(n);
  }else{
   if(key===null)key=/notes?/i.test(m[0].split(/\s+(?:to|as)\s+/i)[0])?'description':'production_instructions';
   raw=raw.trim().slice(0,f.max);
  }
  const el=form.elements.namedItem(key);
  if(!el||el.disabled){smVoiceSay('I cannot edit that job field.');return true;}
  el.value=raw;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));
  smVoiceSay((key==='width_mm'?'Width':key==='height_mm'?'Height':key==='production_instructions'?'Production instructions':key==='description'?'Job notes':key.charAt(0).toUpperCase()+key.slice(1))+' set to '+raw+'.');return true;
 }
 return false;
}
async function smVoiceCommand(input){
 const c=String(input).toLowerCase().replace(/[.!?]+$/,'').trim();
 if(smVoiceJobDraft(input))return;
 if(/\b(stop speaking|be quiet|silence|stop talking)\b/.test(c)){smVoiceStopSpeaking();smVoiceStatus('Speech stopped.');return;}
 if(/\b(what can you do|help|read commands|voice functions|available commands)\b/.test(c)){smVoiceReadHelp();return;}
 if(/\b(owe|owes|owing|outstanding|balance|balances|unpaid|paid|received|collected|debtors|money due)\b/.test(c)&&!/\b(open|show|go to|navigate)\b/.test(c)){await smVoiceFinance(c);return;}
 const destinations=[
  [/\b(dashboard|home|overview)\b/,'dashboard'],
  [/\b(workshop|work shop)\b/,'workshop_link'],
  [/\b(production board)\b/,'board'],
  [/\b(customer|customers|clients)\b/,'customers'],
  [/\b(quotation|quotations|quotes|quote)\b/,'quotations'],
  [/\b(invoice|invoices)\b/,'invoices'],
  [/\b(payment|payments)\b/,'payments'],
  [/\b(stock|inventory|materials)\b/,'stock'],
  [/\b(notes|note)\b/,'notes'],
  [/\b(calculator|calculate)\b/,'calculator'],
  [/\b(vehicle|vehicles|catalogue)\b/,'vehicles'],
  [/\b(job|jobs)\b/,'jobs']
 ];
 if(/\b(delete|remove|pay|refund|record payment|approve|send|submit|save)\b/.test(c)){
  smVoiceStatus('For safety, this command must be completed using the normal app controls.');return;
 }
 if(/\b(create|add|new|start)\b/.test(c)&&/\bjob\b/.test(c)){
  if(['production','stock_controller','viewer'].includes(me.role)){smVoiceStatus('Your role cannot create jobs.');return;}
  go('jobs');jobForm();smVoiceSay('New job form opened. You can now dictate the title, width, height, quantity, price and instructions. Say read job draft to review. Saving remains manual.');return;
 }
 const dest=destinations.find(([re])=>re.test(c));
 if(!dest){smVoiceStatus('Command not recognised: '+input+'. Try “Open customers” or “Show jobs”.');return;}
 const target=dest[1];
 if(['production','stock_controller'].includes(me.role)&&!['stock','notes','production_workspace'].includes(target)){
  if(target==='workshop_link'){window.open('/workshop-display','_blank','noopener');smVoiceStatus('Opening Workshop Display.');return;}
  smVoiceStatus('This section is not available to your role.');return;
 }

let recognition=null,recorder=null,voiceChunks=[],voiceStream=null;
function voiceStatus(msg){let el=$('#voiceStatus');if(el)el.textContent=msg}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){voiceStatus('Live recognition is unavailable in this browser. Use Record audio instead.');return}
 stopVoice();recognition=new SR();recognition.lang=$('#voiceLang').value;recognition.continuous=true;recognition.interimResults=false;
 recognition.onresult=e=>{let box=$('#voiceText');if(!box)return;for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)box.value+=(box.value?' ':'')+e.results[i][0].transcript;};
 recognition.onerror=e=>voiceStatus('Speech recognition: '+e.error+'. Try Record audio.');recognition.onend=()=>voiceStatus('Recognition stopped. Review your text.');
 try{recognition.start();voiceStatus('Listening… speak your job details now.')}catch(e){voiceStatus(e.message)}
}

async function recordVoice(){
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){voiceStatus('Recording unavailable in this browser. Try a supported browser or select a file.');return}
 if(recorder?.state==='recording')return;
 try{voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];
 const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 recorder=new MediaRecorder(voiceStream,mime?{mimeType:mime}:{});
 recorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
 recorder.onstop=async()=>{voiceStream?.getTracks().forEach(x=>x.stop());voiceStatus('Uploading audio for transcription…');let blob=new Blob(voiceChunks,{type:recorder.mimeType||'audio/webm'});await sendVoiceAudio(blob)};
 recorder.start();voiceStatus('Recording… tap Stop recording when finished.');}catch(e){voiceStatus('Microphone error: '+e.message)}
}

 try{const r=await fetch('/api/voice/transcribe',{method:'POST',body:fd,credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(d.detail||'Transcription failed');let el=$('#voiceText');if(el)el.value+=(el.value?' ':'')+d.text;voiceStatus('Transcribed. Review the words, then choose Review job details.')}catch(e){voiceStatus(e.message)}

function prepareVoiceJob(){
 const text=$('#voiceText')?.value.trim();if(!text)return sm360Notice('Speak or type the job details first.');
 const lower=text.toLowerCase();
 // Conservative extraction: unrecognised details remain visible in job notes for manual review.
 let quantity=1,price=0,width=0,height=0,material='',due='',assigned=null,customer=null;
 const q=lower.match(/(?:quantity|qty|hoeveelheid)\s*[: ]\s*(\d+)/)||lower.match(/\b(\d+)\s+(?:vinyl|stickers?|banners?|boards?|signs?|plakkers?|borde)/);
 if(q)quantity=Math.max(1,Number(q[1]));
 const p=lower.match(/(?:price|cost|total|prys|bedrag)\s*(?:is|of|van|:)?\s*(?:r\s*)?([\d ,.]+)/)||lower.match(/\br\s*([\d ,.]+)/);
 if(p)price=Number(p[1].replace(/[ ,]/g,''))||0;
 const size=lower.match(/(\d+(?:[.,]\d+)?)\s*(mm|millimet(?:er|re)s?|cm|m|met(?:er|re)s?)?\s*(?:by|x|×|\u00d7)\s*(\d+(?:[.,]\d+)?)\s*(mm|millimet(?:er|re)s?|cm|m|met(?:er|re)s?)?/);
 if(size){let conv=(v,u)=>Number(v.replace(',','.'))*(u==='m'||u?.startsWith('met')?1000:u==='cm'?10:1);width=conv(size[1],size[2]||size[4]);height=conv(size[3],size[4]||size[2]);}
 const date=lower.match(/\b(20\d\d-\d\d-\d\d)\b/);if(date)due=date[1];
 const mat=lower.match(/(?:material|materiaal)\s*(?:is|:)?\s*([\w\s-]{2,35})(?:[.,]|$)/);if(mat)material=mat[1].trim();
 const person=lower.match(/(?:assigned to|assign to|gee vir|toegeken aan)\s+([a-z]+(?:\s+[a-z]+)?)/);
 if(person){let found=users.find(u=>u.name.toLowerCase()===person[1].trim())||users.find(u=>u.name.toLowerCase().startsWith(person[1].split(' ')[0]));if(found)assigned=found.id}
 const cust=lower.match(/(?:for|customer|client|vir|kliënt)\s+([a-z]+(?:\s+[a-z]+)?)/);
 if(cust){let found=customers.find(c=>c.name.toLowerCase()===cust[1].trim())||customers.find(c=>c.name.toLowerCase().startsWith(cust[1].split(' ')[0]));if(found)customer=found.id}
 let title=text.replace(/^(create|add|maak|skep)\s+(a|an|new|nuwe)?\s*(job|werk|job card|werkskaart)\s*/i,'').slice(0,90)||'Voice job';
 jobForm();let f=$('#jobForm');if(!f)return;
 const set=(name,val)=>{let e=f.elements.namedItem(name);if(e)e.value=val??''};
 set('title',title);set('description','Voice draft (verify details): '+text);set('quantity',quantity);set('price',price);set('width_mm',width);set('height_mm',height);set('due_date',due);set('material',material);set('assigned_id',assigned);set('customer_id',customer);
 const msg=document.createElement('p');msg.className='hint';msg.textContent='Voice draft only. Confirm the customer, dimensions, due date and all other details before clicking Save job.';f.prepend(msg);
}

<script>
/* Tenant-scoped team note and job-creator completion voice notifications. */
(function(){
  let voiceEnabled=false, queue=[], speaking=false, soundContext=null, identity=null, initialised=false;
  let lastDone=0, seenNotes=new Set(), busy=false, voiceKey=null, epoch=0;
  const activePopups=new Set();
  const speechSupported=!!window.speechSynthesis && !!window.SpeechSynthesisUtterance;
  const getKey=(suffix)=>'sm360_voice_'+identity.business_id+'_'+identity.id+'_'+suffix;
  function clearVoiceState(){
    epoch++; queue.length=0; speaking=false;
    try{if(speechSupported)speechSynthesis.cancel()}catch(_){}
    for(const popup of activePopups)popup.remove();
    activePopups.clear();
  }
  function resetIdentity(){
    clearVoiceState();identity=null;initialised=false;seenNotes.clear();lastDone=0;voiceEnabled=false;voiceKey=null;
    renderVoiceControl();
  }
  function savePreference(value){
    voiceEnabled=!!value;
    if(voiceKey)try{localStorage.setItem(voiceKey,voiceEnabled?'on':'off')}catch(_){}
    if(!voiceEnabled)clearVoiceState();
    renderVoiceControl();
  }
  function unlockAudio(){
    try{if(!soundContext)soundContext=new (window.AudioContext||window.webkitAudioContext)();soundContext.resume().catch(()=>{})}catch(_){}
    if(speechSupported)try{let u=new SpeechSynthesisUtterance('Team voice alerts enabled');u.lang='en-ZA';speechSynthesis.speak(u)}catch(_){}
  }
  function renderVoiceControl(){
    const b=document.getElementById('sm360VoiceEnable');
    if(!b)return;
    const allowed=!!identity && String(identity.role||'').toLowerCase()!=='viewer';
    b.disabled=!allowed;
    b.textContent=!allowed?'Unavailable for viewers':(voiceEnabled?'🔊 ON · Turn Off':'🔇 Enable Team Voice Alerts');
    b.setAttribute('aria-pressed',String(allowed&&voiceEnabled));
    b.title=allowed?'Voice preference is saved for this account on this browser.':'Viewers cannot enable team voice alerts.';
  }
  window.sm360ToggleTeamVoice=function(){
    if(!identity||String(identity.role||'').toLowerCase()==='viewer')return;
    if(voiceEnabled)savePreference(false);
    else{savePreference(true);unlockAudio();}
  };
  window.sm360RefreshTeamVoiceControl=renderVoiceControl;
  function chime(){try{const ctx=soundContext||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=850;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.17)}catch(_){}}
  function speakNext(){if(speaking||!queue.length||!voiceEnabled)return;const currentEpoch=epoch;speaking=true;const msg=queue.shift();chime();if(!speechSupported){speaking=false;return;}try{let u=new SpeechSynthesisUtterance(msg);u.lang='en-ZA';u.rate=.95;u.onend=u.onerror=()=>{if(currentEpoch!==epoch)return;speaking=false;speakNext()};speechSynthesis.speak(u)}catch(_){speaking=false;}}
  function alertUser(message,detail,openNotes){
    const n=document.createElement('button');n.type='button';n.style.cssText='position:fixed;top:80px;right:20px;z-index:99999;background:#145f9a;color:white;padding:16px;border:1px solid #8acbff;border-radius:12px;box-shadow:0 8px 30px #0008;max-width:350px;text-align:left';
    n.textContent='🔔 '+detail;activePopups.add(n);n.onclick=()=>{activePopups.delete(n);n.remove();if(openNotes){try{if(typeof navigate==='function')navigate('notes');else if(typeof go==='function')go('notes')}catch(_){}}};document.body.appendChild(n);setTimeout(()=>{activePopups.delete(n);n.remove()},15000);
    queue.push(message);speakNext();
  }
  async function poll(){
    if(busy)return;busy=true;
    try{
      let mr=await fetch('/api/me',{credentials:'same-origin'});if(!mr.ok){resetIdentity();return;}
      const me=await mr.json();if(!me.id||!me.business_id){resetIdentity();return;}
      if(identity&&(identity.id!==me.id||identity.business_id!==me.business_id))resetIdentity();
      identity=me;
      if(me.role==='viewer'){clearVoiceState();voiceEnabled=false;renderVoiceControl();return;}
      const nextVoiceKey=getKey('preference');
      if(voiceKey!==nextVoiceKey){voiceKey=nextVoiceKey;try{voiceEnabled=localStorage.getItem(voiceKey)!=='off'}catch(_){voiceEnabled=true}}
      if(!initialised){renderVoiceControl();lastDone=Number(sessionStorage.getItem(getKey('done'))||0);}
      const requestEpoch=epoch;
      const nr=await fetch('/api/notes',{credentials:'same-origin'});
      if(requestEpoch!==epoch)return;
      if(!nr.ok){if(nr.status===401||nr.status===403)resetIdentity();return;}
      if(nr.ok){const notes=await nr.json();if(requestEpoch!==epoch)return;const check=await fetch('/api/me',{credentials:'same-origin'});if(!check.ok){resetIdentity();return;}const still=await check.json();if(still.id!==me.id||still.business_id!==me.business_id){resetIdentity();return;}const team=notes.filter(n=>n.visibility==='team');const ids=new Set(team.map(n=>Number(n.id)));
        if(initialised){for(const n of team){const id=Number(n.id);if(!seenNotes.has(id))alertUser('You have a new message.','New team note: '+n.title,true)}}
        seenNotes=ids;
      }
      if(['admin','sales'].includes(me.role)){
        const dr=await fetch('/api/workshop/ready-events?after='+lastDone,{credentials:'same-origin'});
        if(requestEpoch!==epoch)return;
        if(!dr.ok&&(dr.status===401||dr.status===403)){resetIdentity();return;}
        if(dr.ok){const events=await dr.json();if(requestEpoch!==epoch)return;const check=await fetch('/api/me',{credentials:'same-origin'});if(!check.ok){resetIdentity();return;}const still=await check.json();if(still.id!==me.id||still.business_id!==me.business_id){resetIdentity();return;}if(!initialised&&!lastDone&&events.length){lastDone=events[events.length-1].id;}
          else for(const e of events){lastDone=Math.max(lastDone,e.id);alertUser('Order '+e.job_id+' has been completed. Please see instructions.','Order '+e.job_id+' is done',false)}
          sessionStorage.setItem(getKey('done'),String(lastDone));
        }
      }
      initialised=true;
    }catch(e){console.warn('Team voice notifications:',e)}finally{busy=false;}
  }
  setInterval(poll,5000);setTimeout(poll,2000);
})();
</script>
